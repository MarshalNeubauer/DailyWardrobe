# Cloudflare Worker config, used by .github/workflows/deploy-worker.yml to deploy worker.js automatically.
# The account ID and KV namespace ID come from GitHub Actions variables at deploy time (placeholders below).
# Secrets (APP_TOKEN, ANTHROPIC_API_KEY, OPENAI_API_KEY) stay in Cloudflare: a deploy never changes them.
name = "wardrobevision"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
# no per-version public preview links
preview_urls = false
# keep the plain variables set in the Cloudflare dashboard (ALLOWED_ORIGIN, CLAUDE_MODEL, OPENAI_IMAGE_MODEL, ...)
keep_vars = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "WARDROBE"
id = "WARDROBE_KV_ID"

# background outfit photos: the app queues jobs, the consumer below makes one photo per message (created by the deploy workflow)
[[queues.producers]]
queue = "wardrobe-renders"
binding = "RENDER_QUEUE"

[[queues.consumers]]
queue = "wardrobe-renders"
max_batch_size = 1
max_retries = 5
max_concurrency = 2

[observability]
enabled = true
