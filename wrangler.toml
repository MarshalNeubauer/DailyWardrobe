# Cloudflare Worker config, used by .github/workflows/deploy-worker.yml to deploy worker.js automatically.
# The account ID and KV namespace ID come from GitHub Actions variables at deploy time (placeholders below).
# Secrets (APP_TOKEN, ANTHROPIC_API_KEY, OPENAI_API_KEY) stay in Cloudflare: a deploy never changes them.
name = "wardrobevision"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
# no per-version public preview links
preview_urls = false
# keep the plain variables set in the Cloudflare dashboard (ALLOWED_ORIGIN, CLAUDE_MODEL, OPENAI_IMAGE_MODEL, ...)
keep_vars = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "WARDROBE"
id = "WARDROBE_KV_ID"

# finishing a deleted account a part per message (worker.js queue, people.js runWipe; created by the deploy workflow). The name is from
# when it made outfit photos (removed 2026-11-14); kept so the binding and the queue need no change
[[queues.producers]]
queue = "wardrobe-renders"
binding = "RENDER_QUEUE"

[[queues.consumers]]
queue = "wardrobe-renders"
max_batch_size = 1
max_retries = 5
max_concurrency = 2

# each tester's daily counts and "switched off" mark (people.js useCount; one object per person). It also pushed finished outfit
# photos to an open app until 2026-11-14; the class stays, so no migration is needed
[[durable_objects.bindings]]
name = "RENDER_HUB"
class_name = "RenderHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RenderHub"]

# the morning reminders (worker.js sendReminders): every 15 minutes, the phones whose reminder time falls in that quarter of an hour
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
