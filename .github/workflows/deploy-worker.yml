name: Deploy worker
# Deploys worker.js to Cloudflare whenever a change to it reaches main (after the tests pass).
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   secret   CLOUDFLARE_API_TOKEN   (Cloudflare token from the "Edit Cloudflare Workers" template, plus Queues edit)
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable WARDROBE_KV_ID         (ID of the KV namespace bound as WARDROBE)
on:
  push:
    branches: [main]
    paths: [worker.js, wrangler.toml, .github/workflows/deploy-worker.yml]
  workflow_dispatch:
concurrency: deploy-worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Check configuration
        id: cfg
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV: ${{ vars.WARDROBE_KV_ID }}
        run: |
          if [ -z "$TOKEN$ACCOUNT$KV" ]; then echo "::notice::Automatic worker deploys are not set up yet (no Cloudflare token or IDs); skipping."; echo "ready=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          missing=""
          [ -n "$TOKEN" ] || missing="$missing secret CLOUDFLARE_API_TOKEN;"
          [ -n "$ACCOUNT" ] || missing="$missing variable CLOUDFLARE_ACCOUNT_ID;"
          [ -n "$KV" ] || missing="$missing variable WARDROBE_KV_ID;"
          if [ -n "$missing" ]; then echo "::error::Missing in Settings > Secrets and variables > Actions:$missing"; exit 1; fi
          echo "$KV" | grep -Eq '^[0-9a-f]{32}$' || { echo "::error::WARDROBE_KV_ID should be the 32-character namespace ID"; exit 1; }
          echo "ready=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.ready == 'yes'
        with:
          node-version: 22
      # no package-lock.json: written here it is a new file in the checkout, which the test selection below takes for a
      # change and answers with every test (the first run of this workflow did just that)
      - run: npm install --no-package-lock
        if: steps.cfg.outputs.ready == 'yes'
      # The tests: only what the change since origin/main can affect (tests/impact.js). On main that is nothing when the
      # merged branch was tested before the merge (tests/impact.map carries the fingerprint of these very files), and
      # every test when it was not. A browser is therefore installed only when tests will really run: a deploy must not
      # wait on Ubuntu's package mirrors (2026-11-11: they could not be resolved from the runners for hours, and every
      # deploy failed in the browser install although no test needed a browser).
      - name: Which tests will run
        id: sel
        if: steps.cfg.outputs.ready == 'yes'
        run: |
          node tests/run.js --changed --list | tee "$RUNNER_TEMP/selection.txt"
          # these two sentences are tests/impact.js saying that nothing runs; anything else (or no answer) installs the browser
          if grep -Eq 'No check can be affected by this change\.|Nothing more needs to run\.' "$RUNNER_TEMP/selection.txt"; then echo "browser=no"; else echo "browser=yes"; fi >> "$GITHUB_OUTPUT"
      - name: Install Chromium (only when tests will run)
        if: steps.sel.outputs.browser == 'yes'
        run: |
          # system packages through apt, for at most two minutes and without failing the deploy: the runner image already
          # has Chromium's libraries, apt adds fonts only
          timeout -k 10 120 npx playwright install-deps chromium || echo "::warning::Chromium's system packages could not be installed (apt); the tests run with what the runner image has."
          # the browser itself, tried three times
          for i in 1 2 3; do npx playwright install chromium && exit 0; sleep $((i * 15)); done
          exit 1
      - run: npm test
        if: steps.cfg.outputs.ready == 'yes'
      - name: Deploy to Cloudflare
        if: steps.cfg.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV: ${{ vars.WARDROBE_KV_ID }}
        # the KV namespace ID goes into wrangler.toml only here, after the tests (the repo copy keeps a placeholder)
        run: |
          sed -i "s/WARDROBE_KV_ID/$KV/" wrangler.toml
          # the queue for background photos must exist before a deploy can bind it (needs Queues edit on the token)
          npx --yes wrangler@4.158.0 queues info wardrobe-renders >/dev/null 2>&1 || npx --yes wrangler@4.158.0 queues create wardrobe-renders
          npx --yes wrangler@4.158.0 deploy
