name: Deploy worker
# Deploys worker.js (the entry; Wrangler bundles its ES modules in worker/ and merge.js, the merge rules it shares with the app) to Cloudflare whenever a change to it reaches main (after the tests pass).
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   secret   CLOUDFLARE_API_TOKEN   (Cloudflare token from the "Edit Cloudflare Workers" template, plus Queues edit)
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable WARDROBE_KV_ID         (ID of the KV namespace bound as WARDROBE)
on:
  push:
    branches: [main]
    paths: [worker.js, 'worker/**', merge.js, wrangler.toml, .github/workflows/deploy-worker.yml]
  workflow_dispatch:
    inputs:
      # a dry run of this workflow on any branch (e.g. to try the browser install): its tests, never a deploy
      check:
        description: 'Check only: run the tests and their browser installs, do not deploy'
        type: boolean
        default: false
      only:
        description: 'With check: run the tests whose file name contains this (with their WebKit halves) instead of the change''s selection'
        required: false
        default: ''
# (a check run has its own group: queued behind a deploy it would cancel that deploy's place in the queue)
concurrency: ${{ inputs.check && format('deploy-worker-check-{0}', github.ref) || 'deploy-worker' }}
# the job only reads the repository; the Cloudflare token is its own secret
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # the whole history: tests compare the app with older commits (garmentpaint.test.js reads #511's first parent with `git show`),
      # which a shallow checkout lacks ("fatal: bad object", the failed deploy of #557, 2026-11-17)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check configuration
        id: cfg
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV: ${{ vars.WARDROBE_KV_ID }}
        run: |
          # a warning, not a quiet notice: this run means worker.js (or its config) changed on main, and the live worker stays the old one
          if [ -z "$TOKEN$ACCOUNT$KV" ]; then echo "::warning::worker.js changed on main but was NOT deployed: automatic worker deploys are not set up (no Cloudflare token or IDs). Deploy it by hand (npx wrangler deploy) or add the secret and variables listed at the top of this workflow."; echo "ready=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          missing=""
          [ -n "$TOKEN" ] || missing="$missing secret CLOUDFLARE_API_TOKEN;"
          [ -n "$ACCOUNT" ] || missing="$missing variable CLOUDFLARE_ACCOUNT_ID;"
          [ -n "$KV" ] || missing="$missing variable WARDROBE_KV_ID;"
          if [ -n "$missing" ]; then echo "::error::Missing in Settings > Secrets and variables > Actions:$missing"; exit 1; fi
          echo "$KV" | grep -Eq '^[0-9a-f]{32}$' || { echo "::error::WARDROBE_KV_ID should be the 32-character namespace ID"; exit 1; }
          echo "ready=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.ready == 'yes'
        with:
          node-version: 22
      # no package-lock.json: written here it is a new file in the checkout, which the test selection below takes for a
      # change and answers with every test (the first run of this workflow did just that)
      - run: npm install --no-package-lock
        if: steps.cfg.outputs.ready == 'yes'
      # The tests: only what the change since origin/main can affect (tests/impact.js). On main that is nothing when the
      # merged branch was tested before the merge (tests/impact.map carries the fingerprint of these very files), and
      # every test when it was not. A browser is therefore installed only when tests will really run: a deploy must not
      # wait on Ubuntu's package mirrors (2026-11-11: they could not be resolved from the runners for hours, and every
      # deploy failed in the browser install although no test needed a browser).
      - name: Which tests will run
        id: sel
        if: steps.cfg.outputs.ready == 'yes'
        env:
          ONLY: ${{ inputs.check && inputs.only || '' }}
        run: |
          # a check run by name (below) runs those files and their WebKit halves: both browsers
          if [ -n "$ONLY" ]; then echo "Check run: the tests named \"$ONLY\", with their WebKit halves"; printf 'browser=yes\nwebkit=yes\n' >> "$GITHUB_OUTPUT"; echo "pw=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"; exit 0; fi
          node tests/run.js --changed --list | tee "$RUNNER_TEMP/selection.txt"
          # these two sentences are tests/impact.js saying that nothing runs; anything else (or no answer) installs the browser
          if grep -Eq 'No check can be affected by this change\.|Nothing more needs to run\.' "$RUNNER_TEMP/selection.txt"; then echo "browser=no"; else echo "browser=yes"; fi >> "$GITHUB_OUTPUT"
          # the WebKit halves (tests/run.js webkitWanted, #551): its "WebKit: …" line says whether any run; a line that is not
          # "… do not run" installs WebKit too, so the deploy runs every check its `npm test` selected
          if grep -q '^WebKit: ' "$RUNNER_TEMP/selection.txt" && ! grep -Eq '^WebKit: .*do not run' "$RUNNER_TEMP/selection.txt"; then echo "webkit=yes"; else echo "webkit=no"; fi >> "$GITHUB_OUTPUT"
          echo "pw=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # the downloaded browsers are kept between runs (Playwright's version and the browsers in the key)
      - uses: actions/cache@v4
        if: steps.sel.outputs.browser == 'yes'
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.sel.outputs.pw }}-${{ steps.sel.outputs.webkit == 'yes' && 'chromium-webkit' || 'chromium' }}
      - name: Install the browsers (only when tests will run)
        if: steps.sel.outputs.browser == 'yes'
        run: |
          B=chromium; [ "${{ steps.sel.outputs.webkit }}" = yes ] && B="chromium webkit"
          # the browsers themselves, tried three times (a cached browser is not downloaded again)
          for i in 1 2 3; do npx playwright install $B && exit 0; sleep $((i * 15)); done
          exit 1
      # their system packages (apt), never failing here: the runner image already has Chromium's libraries (apt adds fonts only);
      # WebKit needs its own, and without them its halves fail to start in npm test, which then stops the deploy with the reason.
      # The .deb files are cached (tools/ci-browser-deps.sh: keyed by the runner image, Playwright's version and the package
      # list) and installed offline; apt only when the cache misses, for two minutes (eight with WebKit; 2026-11-17/18 it took
      # 23 s to over five minutes a runner)
      - name: The browsers' system packages (cache key)
        id: aptkey
        if: steps.sel.outputs.browser == 'yes'
        run: |
          B=chromium; [ "${{ steps.sel.outputs.webkit }}" = yes ] && B="chromium webkit"
          L=$(bash tools/ci-browser-deps.sh list $B | sha256sum | cut -c1-12)
          echo "b=$B" >> "$GITHUB_OUTPUT"
          echo "base=browser-apt-$ImageOS-pw${{ steps.sel.outputs.pw }}-${B// /-}-$L-" >> "$GITHUB_OUTPUT"
          echo "key=browser-apt-$ImageOS-pw${{ steps.sel.outputs.pw }}-${B// /-}-$L-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: aptc
        if: steps.sel.outputs.browser == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/browser-apt
          key: ${{ steps.aptkey.outputs.key }}
          restore-keys: ${{ steps.aptkey.outputs.base }}
      - name: The browsers' system packages
        id: apt
        if: steps.sel.outputs.browser == 'yes'
        run: |
          T=120; [ "${{ steps.sel.outputs.webkit }}" = yes ] && T=480
          bash tools/ci-browser-deps.sh install ~/.cache/browser-apt $T ${{ steps.aptkey.outputs.b }}
      - if: steps.apt.outputs.save == 'yes' && steps.aptc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/browser-apt
          key: ${{ steps.aptkey.outputs.key }}
      - run: npm test
        if: steps.cfg.outputs.ready == 'yes'
        env:
          # a check run (Run workflow with "check"): the tests by name instead of the change's selection, and no deploy
          TEST_ONLY: ${{ inputs.check && inputs.only || '' }}
      - name: Deploy to Cloudflare
        if: steps.cfg.outputs.ready == 'yes' && !inputs.check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV: ${{ vars.WARDROBE_KV_ID }}
        # the KV namespace ID goes into wrangler.toml only here, after the tests (the repo copy keeps a placeholder)
        run: |
          sed -i "s/WARDROBE_KV_ID/$KV/" wrangler.toml
          # the queue (account deletion's remaining parts) must exist before a deploy can bind it (needs Queues edit on the token)
          npx --yes wrangler@4.158.0 queues info wardrobe-renders >/dev/null 2>&1 || npx --yes wrangler@4.158.0 queues create wardrobe-renders
          npx --yes wrangler@4.158.0 deploy
