<script>
const TYPES={suit:'Suit',blazer:'Blazer',pants:'Dress pants',shirt:'Dress shirt',tie:'Tie',tieclip:'Tie clip',watch:'Watch',shoes:'Shoes',belt:'Belt',socks:'Socks'};
const COLORS={black:'#16161a',charcoal:'#3b3f46',grey:'#8b8f96',white:'#f6f6f3',cream:'#efe4c8',lightblue:'#a9c7e4',blue:'#3f6fb5',navy:'#1b2a4a',brown:'#5a3a22',tan:'#b8946a',olive:'#5b5d36',green:'#2f6b4a',burgundy:'#6d1f2c',red:'#b3262e',purple:'#5d3a7a',pink:'#e3a5b4',gold:'#c9a227',silver:'#c3c6cb'};
const METAL={gold:'#c9a227',silver:'#c3c6cb',other:'#7d8187'},PATS_BY=(()=>{const suiting=['solid','pinstripe','chalk-stripe','herringbone','birdseye','nailhead','sharkskin','houndstooth','glen-check','windowpane','tweed','twill','other'];

PAT_ALIAS={suit:{stripe:'pinstripe',check:'glen-check',plaid:'glen-check',texture:'twill'},shirt:{texture:'oxford',plaid:'check'},tie:{texture:'knit',dots:'polka-dot',plaid:'check'}},

patLabel=p=>String(p||'').replace(/-/g,' '),
COL_ALIAS={gray:'grey',lightgray:'grey',lightgrey:'grey',silvergrey:'silver',silvergray:'silver',darkgray:'charcoal',darkgrey:'charcoal',slate:'charcoal',
  lightblue:'lightblue',skyblue:'lightblue',babyblue:'lightblue',paleblue:'lightblue',powderblue:'lightblue',royalblue:'blue',cobalt:'blue',
  darkblue:'navy',midnightblue:'navy',midnight:'navy',ivory:'cream',offwhite:'cream',ecru:'cream',beige:'tan',khaki:'tan',camel:'tan',sand:'tan',taupe:'tan',
  darkbrown:'brown',chocolate:'brown',cognac:'brown',maroon:'burgundy',wine:'burgundy',oxblood:'burgundy',darkred:'burgundy',
  yellow:'gold',mustard:'gold',lavender:'purple',violet:'purple',plum:'purple',rose:'pink',salmon:'pink',teal:'green',emerald:'green',forestgreen:'green',darkgreen:'green',olivegreen:'olive'},
normCol=c=>{if(!c)return null;const k=String(c).toLowerCase().replace(/[^a-z]/g,'');if(!k||k==='none'||k==='null')return null;return COLORS[k]?k:COL_ALIAS[k]||null},FABRIC=['suit','blazer','pants','shirt','tie'],COOL=3;
const $=s=>document.querySelector(s),key=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),di=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
let items=[],flt='all',queue=[];const now=new Date();let view={y:now.getFullYear(),m:now.getMonth()},sel=new Date(now.getFullYear(),now.getMonth(),now.getDate());

/* storage */
const db=new Promise((ok,no)=>{const r=indexedDB.open('wardrobe',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('items',m);const q=f(t.objectStore('items'));t.oncomplete=()=>ok(q.result);t.onerror=no})};
const put=i=>tx('readwrite',s=>s.put(i)),del=id=>tx('readwrite',s=>s.delete(id));

/* settings management */
function openSettings(){
  if($('#cfg-url')) $('#cfg-url').value=localStorage.getItem('worker_url')||'';
  if($('#cfg-token')) $('#cfg-token').value=localStorage.getItem('app_token')||'';
  if($('#settings-modal')){ $('#settings-modal').style.display='block'; $('#settings-modal').style.pointerEvents='auto'; }
  if($('#modal-backdrop')){ $('#modal-backdrop').style.display='block'; $('#modal-backdrop').style.pointerEvents='auto'; }
}
function closeSettings(){
  if($('#settings-modal')){ $('#settings-modal').style.display='none'; $('#settings-modal').style.pointerEvents='none'; }
  if($('#modal-backdrop')){ $('#modal-backdrop').style.display='none'; $('#modal-backdrop').style.pointerEvents='none'; }
}
function saveSettings(){
  if($('#cfg-url')) localStorage.setItem('worker_url',$('#cfg-url').value.trim());
  if($('#cfg-token')) localStorage.setItem('app_token',$('#cfg-token').value.trim());
  closeSettings();
  renderAdd();
}

/* precision swatch generator */
function generateSwatch(q){
  if(!q.big) return '';
  const canvas=q.big;
  const zoom=Number(q.zoom)||1;
  const cx=Number(q.cx)||0.5;
  const cy=Number(q.cy)||0.5;
  const sampleSize=Math.min(canvas.width,canvas.height)*(0.5/zoom);
  const o=document.createElement('canvas');
  o.width=o.height=128;
  const sx=Math.max(0,Math.min(canvas.width-sampleSize,cx*canvas.width-sampleSize/2));
  const sy=Math.max(0,Math.min(canvas.height-sampleSize,cy*canvas.height-sampleSize/2));
  o.getContext('2d').drawImage(canvas, sx, sy, sampleSize, sampleSize, 0, 0, 128, 128);
  q.swatch=o.toDataURL('image/png');
  return q.swatch;
}

/* Pattern detection from the item photo.
   - stripes:     1-D band sequence + angle            (stripe, pinstripe, chalk stripe)
   - checks:      two perpendicular band sequences      (check, gingham, tattersall, windowpane, glen check)
   Fine weaves (herringbone, birdseye, nailhead, sharkskin, twill) are not measured: a phone photo of a whole
   garment doesn't resolve them reliably, so they use drawn tiles with the correct orientation.
   Colours always come from the item's tagged colours, matched by brightness rank, so photo colour casts don't leak in. */
const STRIPE_PATS=['stripe','pinstripe','chalk-stripe'],CHECK_PATS=['check','gingham','tattersall','windowpane','glen-check'];
const DETECT_PATS=[...STRIPE_PATS,...CHECK_PATS];

/* region -> luminance grid (downscaled to at most 256px) */
function lumGrid(src,sx,sy,size){
  const N=Math.max(48,Math.round(Math.min(256,size)));
  const cv=document.createElement('canvas');cv.width=cv.height=N;
  const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(src,sx,sy,size,size,0,0,N,N);
  const d=g.getImageData(0,0,N,N).data,L=new Float32Array(N*N);
  for(let i=0;i<N*N;i++)L[i]=(.2126*d[i*4]+.7152*d[i*4+1]+.0722*d[i*4+2])/255;
  return {N,L,scale:size/N};
}
const boxBlur=(a,N)=>{const o=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let s=0,c=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=x+i,Y=y+j;if(X>=0&&Y>=0&&X<N&&Y<N){s+=a[Y*N+X];c++}}o[y*N+x]=s/c}return o};
function sobel(B,N){const gx=new Float32Array(N*N),gy=new Float32Array(N*N);
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const p=(X,Y)=>B[Y*N+X];
    gx[y*N+x]=(p(x+1,y-1)+2*p(x+1,y)+p(x+1,y+1))-(p(x-1,y-1)+2*p(x-1,y)+p(x-1,y+1));
    gy[y*N+x]=(p(x-1,y+1)+2*p(x,y+1)+p(x+1,y+1))-(p(x-1,y-1)+2*p(x,y-1)+p(x+1,y-1));}
  return {gx,gy}}
/* average a per-pixel map along lines perpendicular to angle -> 1-D profile along the angle */
function project(M,N,ang){const R=Math.ceil(N*Math.SQRT1_2)+1,len=2*R,sum=new Float64Array(len),cnt=new Float64Array(len),cs=Math.cos(ang),sn=Math.sin(ang);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=Math.floor((x-N/2)*cs+(y-N/2)*sn+R);sum[t]+=M[y*N+x];cnt[t]++}
  const pr=[];for(let i=0;i<len;i++)if(cnt[i]>=N/3)pr.push(sum[i]/cnt[i]);return pr}
const variance=pr=>{const m=pr.reduce((a,b)=>a+b,0)/pr.length;return pr.reduce((a,v)=>a+(v-m)**2,0)/pr.length};
const normAng=t=>{while(t<=-Math.PI/2)t+=Math.PI;while(t>Math.PI/2)t-=Math.PI;return t};
/* repeat length of a profile via autocorrelation (sub-sample precision) */
function period(prof,minLag=6){
  const m=prof.reduce((a,b)=>a+b,0)/prof.length,P=prof.map(v=>v-m);
  const ac=l=>{let a=0,b=0,c=0;for(let i=0;i+l<P.length;i++){a+=P[i]*P[i+l];b+=P[i]*P[i];c+=P[i+l]*P[i+l]}return a/(Math.sqrt(b*c)||1)};
  const maxLag=Math.floor(P.length*.67),r=[];for(let l=0;l<=maxLag;l++)r.push(l<minLag-1?-1:ac(l));
  let best=-1,T=0;for(let l=minLag;l<maxLag;l++)if(r[l]>r[l-1]&&r[l]>=r[l+1]&&r[l]>best){best=r[l];T=l}
  if(!T||best<.35)return null;
  const half=Math.round(T/2);if(half>=minLag&&r[half]>.9*best&&r[half]>=r[half-1]&&r[half]>=r[half+1])T=half;
  const y0=r[T-1],y1=r[T],y2=r[T+1]??y1,den=y0-2*y1+y2;
  return {T:T+(den?.5*(y0-y2)/den:0),corr:best};
}
/* fold one repeat and cluster it into k brightness levels -> [[rank, fraction], ...] (rank 0 = darkest) */
function foldBands(prof,nColors){
  const pd=period(prof);if(!pd)return null;const Tf=pd.T;
  const M=Math.max(12,Math.round(Tf)),fs=new Float64Array(M),fc=new Float64Array(M);
  prof.forEach((v,i)=>{const k=Math.floor(((i%Tf)/Tf)*M)%M;fs[k]+=v;fc[k]++});
  const F=[...fs].map((v,k)=>v/(fc[k]||1));
  const k=Math.max(2,Math.min(3,nColors)),lo=Math.min(...F),hi=Math.max(...F);
  if(hi-lo<.04)return null;
  let C=k===2?[lo,hi]:[lo,(lo+hi)/2,hi],lab=new Array(M).fill(0);
  for(let it=0;it<20;it++){
    lab=F.map(v=>{let bi=0;for(let j=1;j<k;j++)if(Math.abs(v-C[j])<Math.abs(v-C[bi]))bi=j;return bi});
    C=C.map((c,j)=>{const m=F.filter((_,i)=>lab[i]===j);return m.length?m.reduce((a,b)=>a+b,0)/m.length:c});
  }
  const order=C.map((c,j)=>[c,j]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),rank=[];order.forEach((j,ri)=>rank[j]=ri);
  lab=lab.map(j=>rank[j]);
  let runs=[];for(let i=0;i<M;i++){if(runs.length&&runs[runs.length-1][0]===lab[i])runs[runs.length-1][1]++;else runs.push([lab[i],1])}
  if(runs.length>1&&runs[0][0]===runs[runs.length-1][0])runs[0][1]+=runs.pop()[1];
  const minW=Math.max(1,M*.025);
  for(let pass=0;pass<3;pass++){
    runs=runs.filter((rn,i)=>{if(rn[1]<minW&&runs.length>2){runs[(i+runs.length-1)%runs.length][1]+=rn[1];return false}return true});
    const m=[];for(const rn of runs){if(m.length&&m[m.length-1][0]===rn[0])m[m.length-1][1]+=rn[1];else m.push(rn)}
    if(m.length>1&&m[0][0]===m[m.length-1][0])m[0][1]+=m.pop()[1];runs=m;
  }
  if(runs.length<2||runs.length>14)return null;
  let out=runs.map(([c,w])=>[c,w/M]),T=Tf;
  // the autocorrelation sometimes locks onto two repeats: collapse a sequence that is its own half twice
  const h=out.length/2;
  if(out.length>=4&&out.length%2===0&&out.slice(0,h).every((r,i)=>r[0]===out[i+h][0]&&Math.abs(r[1]-out[i+h][1])<.06)){
    const half=out.slice(0,h).map((r,i)=>[r[0],r[1]+out[i+h][1]]);out=half;T=Tf/2;
  }
  return {runs:out,T};
}

function analyzeStripes(src,sx,sy,size,nColors){
  const {N,L,scale}=lumGrid(src,sx,sy,size),B=boxBlur(boxBlur(L,N),N),{gx,gy}=sobel(B,N);
  let jxx=0,jyy=0,jxy=0;for(let i=0;i<N*N;i++){jxx+=gx[i]*gx[i];jyy+=gy[i]*gy[i];jxy+=gx[i]*gy[i]}
  const coh=Math.sqrt((jxx-jyy)**2+4*jxy*jxy)/((jxx+jyy)||1);if(coh<.25)return null;
  // tensor angle can be 1-2 degrees off, which smears thin lines: keep the sharpest projection nearby.
  // Profiles use the unblurred image: averaging along the stripe already removes the weave texture.
  let th=.5*Math.atan2(2*jxy,jxx-jyy),bt=th,bv=-1;
  for(let dd=-4;dd<=4;dd+=.25){const a=th+dd*Math.PI/180,v=variance(project(L,N,a));if(v>bv){bv=v;bt=a}}
  th=normAng(bt);
  const f=foldBands(project(L,N,th),nColors);if(!f)return null;
  return {kind:'stripes',a:Math.round(th*180/Math.PI),runs:f.runs,Tpx:f.T*scale};
}

function analyzeChecks(src,sx,sy,size,nColors){
  const {N,L,scale}=lumGrid(src,sx,sy,size);
  // the axis pair whose two projections are jointly sharpest
  const score=a=>variance(project(L,N,a))+variance(project(L,N,a+Math.PI/2));
  let ba=0,bs=-1;for(let d=0;d<90;d+=2){const a=d*Math.PI/180,s=score(a);if(s>bs){bs=s;ba=a}}
  for(let dd=-2;dd<=2;dd+=.25){const a=ba+dd*Math.PI/180,s=score(a);if(s>bs){bs=s;ba=a}}
  const pu=project(L,N,ba),pv=project(L,N,ba+Math.PI/2),vu=variance(pu),vv=variance(pv);
  const fu=foldBands(pu,nColors),fv=foldBands(pv,nColors);
  // one strong axis only -> it's really a stripe
  if(fu&&(!fv||vv<.2*vu))return {kind:'stripes',a:Math.round(normAng(ba)*180/Math.PI),runs:fu.runs,Tpx:fu.T*scale};
  if(fv&&(!fu||vu<.2*vv))return {kind:'stripes',a:Math.round(normAng(ba+Math.PI/2)*180/Math.PI),runs:fv.runs,Tpx:fv.T*scale};
  if(!fu||!fv)return null;
  return {kind:'check',a:Math.round(normAng(ba)*180/Math.PI),runs:fu.runs,vruns:fv.runs,ratio:fv.T/fu.T,Tpx:fu.T*scale};
}

/* map brightness ranks onto colour roles. A missing secondary still gets the auto accent colour (role 's'),
   so a grey suit tagged with one colour keeps a lighter pinstripe. */
function mapRuns(runs,item){
  const roles=[['p',COLORS[primaryCol(item)]]];
  roles.push(['s',item.secondaryColor&&COLORS[item.secondaryColor]||accentOf(item)]);
  if(item.tertiaryColor&&COLORS[item.tertiaryColor])roles.push(['t',COLORS[item.tertiaryColor]]);
  roles.sort((a,b)=>lum(a[1])-lum(b[1]));
  const k=Math.max(...runs.map(r=>r[0]))+1;
  const use=k>=roles.length?roles:roles.filter(r=>r[0]!=='t').slice(0,k);
  const pick=rk=>use[Math.round(rk*(use.length-1)/Math.max(1,k-1))][0];
  let bands=runs.map(([rk,f])=>[pick(rk),+f.toFixed(3)]);
  let si=0,bw=-1;bands.forEach((b,i)=>{if(b[0]==='p'&&b[1]>bw){bw=b[1];si=i}});
  return bands.slice(si).concat(bands.slice(0,si));
}

async function ask(c){
  try {
    const workerUrl=localStorage.getItem('worker_url');
    if(!workerUrl) return null;
    const dataUrl=c.toDataURL('image/jpeg',.8);
    const res=await fetch(workerUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json','x-app-token':localStorage.getItem('app_token')||''},
      body:JSON.stringify({image:dataUrl,appToken:localStorage.getItem('app_token')||''})
    });
    if(!res.ok) return null;
    const result=await res.json();
    let parsed;
    try {
      const cleanText=(result.response||'').replace(/```json/g,'').replace(/```/g, '').trim();
      parsed=JSON.parse(cleanText);
    } catch(e) {
      parsed=result;
    }
    return {
      type:TYPES[parsed.type]?parsed.type:'suit',
      pattern:normPat(TYPES[parsed.type]?parsed.type:'suit',parsed.pattern),
      primaryColor:normCol(parsed.primaryColor||parsed.color)||'grey',
      secondaryColor:normCol(parsed.secondaryColor),
      tertiaryColor:normCol(parsed.tertiaryColor),
      metal:METAL[parsed.metal]?parsed.metal:'silver',
      leather:LEATHERS.includes(String(parsed.leather||'').toLowerCase().replace(/\s+/g,'-'))?String(parsed.leather).toLowerCase().replace(/\s+/g,'-'):null,
      dial:normCol(parsed.dial),band:['bracelet','leather'].includes(parsed.band)?parsed.band:null,bezel:['fluted','smooth'].includes(parsed.bezel)?parsed.bezel:null

  } catch(e) {
    return null;
  }
}

      return tile(3,3,`<circle cx=".75" cy=".75" r=".55" fill="${a}" opacity=".45"/><circle cx="2.25" cy="2.25" r=".55" fill="${a}" opacity=".45"/><circle cx=".75" cy=".75" r=".2" fill="${b}"/><circle cx="2.25" cy="2.25" r=".2" fill="${b}"/>`);
    case 'nailhead':
      return tile(2.6,2.6,`<rect x=".9" y=".9" width=".7" height=".7" fill="${a}" opacity=".5"/>`);
    case 'sharkskin':
      return tile(2,2,`<path d="M0,2 L2,0" stroke="${lt}" stroke-opacity=".18" stroke-width=".55"/><path d="M-1,1 L1,-1 M1,3 L3,1" stroke="${dk}" stroke-opacity=".22" stroke-width=".55"/>`);
    case 'twill':case 'texture':
      return tile(3,3,`<path d="M0,3 L3,0" stroke="#000" stroke-opacity=".14" stroke-width=".7"/><path d="M-1,1 L1,-1 M2,4 L4,2" stroke="#fff" stroke-opacity=".08" stroke-width=".5"/>`);
    case 'oxford':
      return tile(2,2,`<rect width="1" height="1" fill="${lt}" opacity=".22"/><rect x="1" y="1" width="1" height="1" fill="${lt}" opacity=".22"/>`);
    case 'knit':
      return tile(3,2.4,`<path d="M0,0 L1.5,1.2 L3,0" fill="none" stroke="${dk}" stroke-opacity=".28" stroke-width=".55"/><path d="M0,1.2 L1.5,2.4 L3,1.2" fill="none" stroke="${lt}" stroke-opacity=".12" stroke-width=".45"/>`);
    case 'tweed':{
      const fleck=[[1,2,a],[6,1,lt],[3,7,'#000'],[8,5,c],[5,4,lt],[9,9,'#000'],[2,9,c],[7,8,a]];
      return tile(10,10,`${twill}${fleck.map(([x,y,c])=>`<rect x="${x}" y="${y}" width="1.1" height=".5" fill="${c}" opacity=".35" transform="rotate(${(x*37)%60-30} ${x} ${y})"/>`).join('')}`);
    }
    /* --- checks --- */
    case 'houndstooth':{
      /* classic construction: 2x2 block = solid dark, solid light, and two diagonally striped quadrants forming the teeth */
      const st=`<path d="M-1,1 L1,-1 M-1,3 L3,-1 M-1,5 L5,-1 M1,5 L5,1 M3,5 L5,3" stroke="${a}" stroke-width=".72"/>`;
      return tile(8,8,`<rect width="4" height="4" fill="${a}"/><svg x="4" y="0" width="4" height="4">${st}</svg><svg x="0" y="4" width="4" height="4">${st}</svg>`,fine?'scale(.6)':'scale(.85)');
    }
    case 'glen-check':
      return tile(16,16,`<path d="M0,1 H8 M0,3 H8 M0,5 H8 M0,7 H8 M9,8 V16 M11,8 V16 M13,8 V16 M15,8 V16" stroke="${ink}" stroke-opacity=".18" stroke-width=".8"/><path d="M8,0 L16,8 M10,0 L16,6 M12,0 L16,4 M8,2 L14,8 M8,4 L12,8 M0,8 L8,16 M0,10 L6,16 M0,12 L4,16 M2,8 L8,14 M4,8 L8,12" stroke="${ink}" stroke-opacity=".14" stroke-width=".6"/><rect x="15.4" width=".6" height="16" fill="${a}" opacity=".7"/><rect y="15.4" width="16" height=".6" fill="${c}" opacity=".7"/>`);
    case 'windowpane':
      return tile(18,18,`${twill}<rect width=".7" height="18" fill="${a}" opacity=".8"/><rect width="18" height=".7" fill="${c}" opacity=".8"/>`);
    case 'gingham':
      return tile(6,6,`<rect width="3" height="6" fill="${a}" opacity=".45"/><rect width="6" height="3" fill="${c}" opacity=".45"/>`);
    case 'tattersall':{
      const c2=item.tertiaryColor&&COLORS[item.tertiaryColor]||mix(a,b,.4);
      return tile(8,8,`<rect width=".6" height="8" fill="${a}"/><rect width="8" height=".6" fill="${a}"/><rect x="4" width=".6" height="8" fill="${c2}"/><rect y="4" width="8" height=".6" fill="${c2}"/>`);
    }
    case 'check':
      if(role==='shirt')return tile(6,6,`<rect width="3" height="6" fill="${a}" opacity=".45"/><rect width="6" height="3" fill="${c}" opacity=".45"/>`);
      if(role==='tie')return tile(6,6,`<rect width="2" height="6" fill="${a}" opacity=".6"/><rect width="6" height="2" fill="${c}" opacity=".6"/>`,'rotate(45)');
      return tile(16,16,`${twill}<rect width=".7" height="16" fill="${a}" opacity=".75"/><rect width="16" height=".7" fill="${a}" opacity=".75"/><rect x="8" width=".4" height="16" fill="${c}" opacity=".45"/><rect y="8" width="16" height=".4" fill="${c}" opacity=".45"/>`);
    /* --- tie motifs --- */
    case 'polka-dot':{
      const s=role==='tie'?9:role==='shirt'?5:10,r=role==='tie'?1.4:role==='shirt'?.7:.9;
      return tile(s,s,`<circle cx="${s/4}" cy="${s/4}" r="${r}" fill="${a}"/><circle cx="${s*3/4}" cy="${s*3/4}" r="${r}" fill="${c}"/>`);
    }
    case 'foulard':{
      const m=`<path d="M0,-1.8 L1.8,0 L0,1.8 L-1.8,0 Z" fill="${a}"/><circle r=".6" fill="${t3||b}"/>`;
      return tile(8,8,`<g transform="translate(2,2)">${m}</g><g transform="translate(6,6)">${m}</g>`);
    }
    case 'paisley':{
      const drop=`<path d="M0,-3.2 C2.6,-3.2 3.2,0 1.6,2 C0.4,3.4 -2.4,3.2 -2.6,1 C-2.8,-1 -1.2,-1.4 -0.6,-0.6 C0.2,0.4 -1.2,1 -1.4,0.4" fill="none" stroke="${a}" stroke-width=".7"/><circle cx="0.3" cy="0.2" r=".6" fill="${c}"/>`;
      return tile(14,14,`<g transform="translate(4,4)">${drop}</g><g transform="translate(11,11) rotate(180)">${drop}</g>`);
    }
  }
  return wool?tile(4,4,twill):tile(4,4,'');
}

/* ---------- accessory drawings, shared by the mannequin and the wardrobe thumbnails ----------
   Every function takes an id prefix P so several drawings can live on one page without id clashes. */
const LEATHERS=['calf','cordovan','suede','patent','pebble-grain','scotch-grain'];
const WATCH_STYLES=[['annual-calendar','Dual time + annual calendar'],['date','Three hands + date'],['no-date','Three hands']];
const BANDS=[['bracelet','Metal bracelet'],['leather','Leather strap']],BEZELS=[['fluted','Fluted'],['smooth','Smooth']];
const watchOpts=w=>({dial:w&&w.dial||'white',band:w&&w.band||'bracelet',bezel:w&&w.bezel||'fluted',style:w&&w.watchStyle||'annual-calendar'});
const METAL_TONES={gold:['#fbefc4','#d4b04a','#8a6d12'],silver:['#f7f8f9','#c4c8cd','#767b82'],other:['#d2d4d7','#868a90','#45494e']};

/* leather surface: base colour, grain texture and a highlight whose strength depends on the leather */
function leatherLayers(P,item,d,toe){
  const L=item&&item.leather||'calf',base=item?colOf(item):'#2b2b2e';
  const col=L==='suede'?mix(base,'#fff',.07):L==='cordovan'?mix(base,'#1e0808',.15):base;
  const hi={calf:.32,cordovan:.42,patent:.9,suede:0,'pebble-grain':.12,'scotch-grain':.2}[L]??.32;
  let defs=`<radialGradient id="${P}hl" gradientUnits="userSpaceOnUse" cx="${toe.x}" cy="${toe.y}" r="${toe.r*(L==='patent'?.7:1)}"><stop offset="0" stop-color="${L==='cordovan'?'#fff3ec':'#fff'}" stop-opacity="${hi}"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
  let tex='',extra='';
  if(L==='suede'){defs+=`<pattern id="${P}tx" patternUnits="userSpaceOnUse" width="1.5" height="1.5"><circle cx=".4" cy=".5" r=".36" fill="#000" opacity=".18"/><circle cx="1.15" cy="1.1" r=".3" fill="#fff" opacity=".12"/></pattern>`;tex=`<path d="${d}" fill="url(#${P}tx)"/>`}
  if(L==='pebble-grain'){defs+=`<pattern id="${P}tx" patternUnits="userSpaceOnUse" width="2.2" height="1.9"><circle cx=".6" cy=".55" r=".55" fill="#fff" fill-opacity=".06" stroke="#000" stroke-opacity=".3" stroke-width=".22"/><circle cx="1.7" cy="1.45" r=".5" fill="#fff" fill-opacity=".06" stroke="#000" stroke-opacity=".3" stroke-width=".22"/></pattern>`;tex=`<path d="${d}" fill="url(#${P}tx)"/>`}
  if(L==='scotch-grain'){defs+=`<pattern id="${P}tx" patternUnits="userSpaceOnUse" width="1.2" height="1.1"><circle cx=".35" cy=".3" r=".3" fill="none" stroke="#000" stroke-opacity=".28" stroke-width=".16"/><circle cx=".95" cy=".85" r=".26" fill="#fff" fill-opacity=".1"/></pattern>`;tex=`<path d="${d}" fill="url(#${P}tx)"/>`}
  if(L==='patent')extra=`<ellipse cx="${toe.x}" cy="${toe.y-toe.r*.18}" rx="${toe.r*.55}" ry="${toe.r*.09}" transform="rotate(${toe.rot||0} ${toe.x} ${toe.y})" fill="#fff" opacity=".75"/>`;
  if(L==='cordovan')extra=`<ellipse cx="${toe.x}" cy="${toe.y-toe.r*.15}" rx="${toe.r*.4}" ry="${toe.r*.12}" transform="rotate(${toe.rot||0} ${toe.x} ${toe.y})" fill="#fff" opacity=".3"/>`;
  return {defs,body:`<path d="${d}" fill="${col}" stroke="#000" stroke-opacity=".35" stroke-width=".5"/>${tex}<path d="${d}" fill="url(#${P}hl)"/>${extra}`,sole:mix(base,'#000',.6)};
}

/* wristwatch seen from above, centred on 0,0; case radius ~15, bracelet to about +/-49.
   Options: dial colour, metal bracelet or leather strap, fluted or smooth bezel, and a dual-time/annual-calendar
   dial (off-centre 24h disc, month apertures, cyclops date). No maker's name or logo is drawn. */
function drawWatch(w,P){
  const o=watchOpts(w),[mL,mM,mD]=METAL_TONES[w&&w.metal]||METAL_TONES.silver,dial=COLORS[o.dial]||'#f6f6f3';
  const ink=lum(dial)<.45?'#e9eaec':'#1d2125',f=n=>+n.toFixed(2),now=new Date();
  let s=`<defs>
   <linearGradient id="${P}br" x1="0" x2="1"><stop offset="0" stop-color="${mD}"/><stop offset=".28" stop-color="${mL}"/><stop offset=".55" stop-color="${mM}"/><stop offset=".8" stop-color="${mL}"/><stop offset="1" stop-color="${mD}"/></linearGradient>
   <linearGradient id="${P}po" x1="0" x2="1"><stop offset="0" stop-color="${mD}"/><stop offset=".35" stop-color="#fff"/><stop offset=".6" stop-color="${mM}"/><stop offset=".85" stop-color="${mL}"/><stop offset="1" stop-color="${mD}"/></linearGradient>
   <radialGradient id="${P}cs" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="${mL}"/><stop offset="1" stop-color="${mD}"/></radialGradient>
   <radialGradient id="${P}dl" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="${mix(dial,'#fff',.4)}"/><stop offset="1" stop-color="${mix(dial,'#000',.07)}"/></radialGradient>
   <linearGradient id="${P}gl" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs><ellipse cx="2.5" cy="52" rx="15" ry="2.6" fill="#000" opacity=".16"/>`;
  if(o.band==='bracelet'){
    // three-piece links: brushed outer links, polished centre link
    for(const sg of [-1,1])for(let k=0;k<6;k++){
      const wd=16.6-k*.45,h=4.9,y=sg>0?17.3+k*5.3:-17.3-k*5.3-h,ow=wd*.36,cw=wd*.25,g=.35;
      s+=`<rect x="${f(-wd/2)}" y="${f(y)}" width="${f(ow-g)}" height="${h}" rx=".7" fill="url(#${P}br)" stroke="${mD}" stroke-width=".12"/>`+
         `<rect x="${f(-cw/2)}" y="${f(y)}" width="${f(cw)}" height="${h}" rx=".7" fill="url(#${P}po)" stroke="${mD}" stroke-width=".12"/>`+
         `<rect x="${f(wd/2-ow+g)}" y="${f(y)}" width="${f(ow-g)}" height="${h}" rx=".7" fill="url(#${P}br)" stroke="${mD}" stroke-width=".12"/>`;
    }
  }else{
    const sc=w?colOf(w):'#3a2414',st=mix(sc,'#fff',.35);
    for(const sg of [-1,1]){const p=`M-8.4,${16*sg} L8.4,${16*sg} L7.2,${44*sg} Q0,${50*sg} -7.2,${44*sg} Z`;
      s+=`<path d="${p}" fill="${sc}" stroke="#000" stroke-opacity=".35" stroke-width=".3"/><path d="M-6.9,${17.5*sg} L-6,${43*sg} M6.9,${17.5*sg} L6,${43*sg}" stroke="${st}" stroke-width=".3" stroke-dasharray=".9 .6"/><path d="${p}" fill="url(#${P}gl)" opacity=".4"/>`}
  }
  s+=`<path d="M-11.6,-10 C-10.6,-13 -9.4,-15.6 -8.6,-17.6 L8.6,-17.6 C9.4,-15.6 10.6,-13 11.6,-10 Z" fill="url(#${P}br)" stroke="${mD}" stroke-width=".15"/><path d="M-11.6,10 C-10.6,13 -9.4,15.6 -8.6,17.6 L8.6,17.6 C9.4,15.6 10.6,13 11.6,10 Z" fill="url(#${P}br)" stroke="${mD}" stroke-width=".15"/>`;
  s+=`<rect x="14.9" y="-2.4" width="3.6" height="4.8" rx=".9" fill="url(#${P}cs)" stroke="${mD}" stroke-width=".2"/>`;
  for(let y=-1.8;y<=1.81;y+=.6)s+=`<line x1="15.4" x2="18.1" y1="${f(y)}" y2="${f(y)}" stroke="${mD}" stroke-width=".14"/>`;
  s+=`<circle r="15.4" fill="url(#${P}cs)" stroke="${mD}" stroke-width=".3"/>`;
  if(o.bezel==='fluted'){for(let i=0;i<96;i++){const a=i/96*Math.PI*2,c=Math.cos(a),n=Math.sin(a),lit=(Math.cos(a+2.4)+1)/2;
    s+=`<line x1="${f(12.95*c)}" y1="${f(12.95*n)}" x2="${f(15.15*c)}" y2="${f(15.15*n)}" stroke="${i%2?mD:mix(mM,'#fff',lit*.8)}" stroke-width=".7"/>`}}
  else s+=`<circle r="14.05" fill="none" stroke="url(#${P}po)" stroke-width="2.1"/>`;
  s+=`<circle r="12.9" fill="none" stroke="${mD}" stroke-width=".3"/><circle r="12.75" fill="url(#${P}dl)"/>`;
  for(let i=0;i<60;i++)if(i%5)s+=`<g transform="rotate(${i*6})"><line y1="-12.1" y2="-12.55" stroke="${ink}" stroke-opacity=".4" stroke-width=".14"/></g>`;
  if(o.style==='annual-calendar'){
    // month apertures next to each hour marker (January at 1 o'clock); the current month shows red
    for(let m=0;m<12;m++)s+=`<g transform="rotate(${(m+1)*30})"><rect x="-.75" y="-12.1" width="1.5" height="1" rx=".15" fill="${m===now.getMonth()?'#c8102e':mix(dial,'#000',.1)}" stroke="${ink}" stroke-opacity=".35" stroke-width=".1"/></g>`;
  }
  for(let h=0;h<12;h++){if(h===3&&o.style!=='no-date')continue;
    const bar=x=>`<rect x="${x}" y="-10.6" width=".95" height="2.4" rx=".2" fill="url(#${P}po)" stroke="${mD}" stroke-width=".12"/>`;
    s+=`<g transform="rotate(${h*30})">${h===0?bar(-1.3)+bar(.35):bar(-.48)}</g>`}
  if(o.style==='annual-calendar'){
    // off-centre 24-hour disc with a red pointer
    s+=`<circle cy="4.7" r="3.9" fill="${mix(dial,'#000',.05)}" stroke="${ink}" stroke-opacity=".35" stroke-width=".15"/>`;
    for(let i=0;i<24;i++)s+=`<g transform="translate(0 4.7) rotate(${i*15})"><line y1="-3.3" y2="${i%2?-3.6:-3.8}" stroke="${ink}" stroke-opacity=".55" stroke-width=".12"/></g>`;
    s+=`<path d="M-.65,.45 L.65,.45 L0,1.45 Z" fill="#c8102e"/>`;
  }
  if(o.style!=='no-date')s+=`<rect x="7.3" y="-1.6" width="3.7" height="3.2" fill="#fff" stroke="${ink}" stroke-opacity=".4" stroke-width=".12"/><text x="9.15" y=".98" font-size="2.7" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" fill="#111">${now.getDate()}</text><rect x="6.5" y="-2.5" width="5.3" height="5" rx="1.1" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".7" stroke-width=".2"/>`;
  const hand=(deg,len,wid,tail)=>`<g transform="rotate(${deg})"><path d="M${-wid/2},${tail} L${-wid/2},${f(-len+wid)} L0,${-len} L${wid/2},${f(-len+wid)} L${wid/2},${tail} Z" fill="url(#${P}po)" stroke="${mD}" stroke-width=".16"/><rect x="${f(-wid*.22)}" y="${f(-len+wid*1.7)}" width="${f(wid*.44)}" height="${f(len*.55)}" fill="#f5f7ef"/></g>`;
  s+=hand(305,6.6,1.3,1.4)+hand(60,10.6,1.05,1.6);
  s+=`<g transform="rotate(210)"><line y1="2.8" y2="-11.6" stroke="${mD}" stroke-width=".22"/></g><circle r=".8" fill="url(#${P}po)" stroke="${mD}" stroke-width=".12"/>`;
  s+=`<circle r="12.75" fill="url(#${P}gl)" opacity=".55"/>`;
  return s;
}

/* square thumbnail for items saved without a photo (also used as the live preview while adding one) */
let thumbN=0;
function itemThumb(i){
  const P='th'+(thumbN++)+'-';let g='';
  if(FABRIC.includes(i.type)){
    const role=i.type==='tie'?'tie':i.type==='shirt'?'shirt':i.type==='pants'?'bot':'top';
    const shape=i.type==='tie'?'M42,8 L58,8 L55,22 L62,78 L50,92 L38,78 L45,22 Z':'M10,10 H90 V90 H10 Z';
    g=`<defs>${fabricDef(P+'f',i,role)}<linearGradient id="${P}s" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".4" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient></defs><path d="${shape}" fill="url(#${P}f)" stroke="#000" stroke-opacity=".25" stroke-width=".6"/><path d="${shape}" fill="url(#${P}s)"/>`;
  }else if(i.type==='watch')g=`<g transform="translate(48 50) scale(.95)">${drawWatch(i,P)}</g>`;
  else if(i.type==='shoes')g=`<g transform="translate(2 22)">${drawOxfordSide(i,P)}</g>`;
  else if(i.type==='socks')g=`<g transform="translate(28 13) scale(1.05)">${drawSock(colOf(i),P)}</g>`;
  else if(i.type==='belt'){const c=colOf(i);g=`<rect x="4" y="40" width="92" height="20" rx="2" fill="${c}" stroke="#000" stroke-opacity=".3"/><path d="M6,43 H94 M6,57 H94" stroke="#fff" stroke-opacity=".2" stroke-width=".6" stroke-dasharray="1.2 .8"/><rect x="58" y="34" width="22" height="32" rx="4" fill="none" stroke="${METAL.silver}" stroke-width="3.2"/><rect x="58" y="49" width="12" height="2.4" fill="${METAL.silver}"/>`}
  else if(i.type==='tieclip'){const m=METAL[i.metal]||METAL.other;g=`<rect x="12" y="45" width="76" height="9" rx="3" fill="${m}" stroke="#000" stroke-opacity=".3"/><rect x="14" y="47" width="72" height="2" rx="1" fill="#fff" opacity=".45"/>`}
  else g=`<rect x="10" y="10" width="80" height="80" rx="8" fill="${colOf(i)}"/>`;
  return `<div class="ph thumb"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${TYPES[i.type]||'Item'}">${g}</svg></div>`;
}

function renderMannequinCanvas(o, containerEl){
  const FORM='#dcd6cb';
  const defs=[],fill={};
  for(const [role,item] of [['top',o.top],['bot',o.bot],['shirt',o.shirt],['tie',o.tie]]){
    if(!item)continue;
    defs.push(fabricDef('fab-'+role,item,role));fill[role]=`url(#fab-${role})`;
  }
  const F=r=>fill[r]||(r==='shirt'?'#f4f3ee':FORM);
  const shade='url(#shade)',seam='stroke="#000" stroke-opacity=".28" stroke-width=".8" stroke-linejoin="round"';
  const both=d=>d+' '+mirror(d);
  const part=(d,f,extra='')=>`<path d="${d}" fill="${f}" ${seam} ${extra}/><path d="${d}" fill="${shade}" pointer-events="none"/>`;

  /* geometry (viewBox 240x600, figure centred on x=120) */
  const torso='M106,90 C92,93 76,98 63,105 C58,140 64,190 75,240 C79,270 78,300 76,336 L164,336 C162,300 161,270 165,240 C176,190 182,140 177,105 C164,98 148,93 134,90 Z';
  const sleeveL='M63,105 C53,109 49,122 47,142 L41,312 L67,316 L74,172 C77,142 75,118 63,105 Z';
  const legL='M79,302 L120,302 L118,553 Q102,557.5 86,553 Z'; // hem breaks slightly over the shoe
  const cuffL='M41,307 L67,311 L66,323 L41,319 Z';
  const lapelL='M108,92 L120,228 C108,206 97,178 89,150 L86,124 L96,121 L93,112 L103,97 Z';
  const collarL='M120,97 L109,84 L103,89 L110,116 Z';
  const vee='M106,90 L134,90 L120,230 Z';
  /* ghost mannequin: no head or hands; show the inside back of the collar and dark sleeve openings instead */
  const neckBack=()=>`<path d="M104,91 C106,79 134,79 136,91 L133,92 C130,84 110,84 107,92 Z" fill="${F('shirt')}" ${seam}/><path d="M104,91 C106,79 134,79 136,91 L133,92 C130,84 110,84 107,92 Z" fill="#000" opacity=".12"/><ellipse cx="120" cy="90.5" rx="13" ry="4.2" fill="#1b1d21" opacity=".78"/>`;
  const opening=(cx,cy,rx,tilt)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="2.3" transform="rotate(${tilt} ${cx} ${cy})" fill="#1b1d21" opacity=".8"/>`;
  const hemGap='M120,298 C119,316 114,328 104,337 L136,337 C126,328 121,316 120,298 Z';

  let s=`<svg viewBox="-34 70 308 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Outfit preview"><defs>
  <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".30"/><stop offset=".32" stop-color="#fff" stop-opacity=".10"/>
    <stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
  <radialGradient id="shine" cx=".35" cy=".35" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <pattern id="silk" patternUnits="userSpaceOnUse" width="1.4" height="1.4" patternTransform="rotate(45)"><rect width=".7" height=".7" fill="#000" opacity=".16"/><rect x=".7" y=".7" width=".7" height=".7" fill="#fff" opacity=".07"/></pattern>
  <radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  ${defs.join('')}</defs>`;

  s+=`<ellipse cx="120" cy="574" rx="66" ry="7" fill="url(#floor)"/>`;

  /* oxfords first, then the trousers resting on them with a slight break */
  s+=drawOxfordFront(o.shoes,'shL')+`<g transform="translate(240,0) scale(-1,1)">${drawOxfordFront(o.shoes,'shR')}</g>`;
  s+=part(both(legL),F('bot'));
  s+=`<path d="${both('M100,330 L102,548')}" stroke="#000" stroke-opacity=".22" stroke-width=".8" fill="none"/>`;
  s+=`<path d="${both('M101,330 L103,548')}" stroke="#fff" stroke-opacity=".12" stroke-width=".6" fill="none"/>`;
  /* sock and watch float beside the feet so their colours are easy to see */
  if(o.socks)s+=`<g transform="translate(-30,488)">${drawSock(colOf(o.socks),'sk-')}</g>`;
  if(o.watch)s+=`<g transform="translate(232,510)">${drawWatch(o.watch,'wt-')}</g>`;

  if(o.top){
    /* shirt cuffs under the sleeves */
    s+=part(both(cuffL),F('shirt'));
    s+=opening(53.5,321,12.4,9)+opening(186.5,321,12.4,-9);
    /* jacket body */
    s+=part(torso,F('top'));
    /* shirt V, tie, collar */
    s+=`<path d="${vee}" fill="${F('shirt')}"/><path d="${vee}" fill="url(#shade)" opacity=".5"/>`;
    s+=neckBack();
    s+=`<path d="M120,118 L120,230" stroke="#000" stroke-opacity=".15" stroke-width=".7"/>`;
  }else{
    /* no jacket: shirt is the outer layer */
    s+=part(both(sleeveL),F('shirt'));
    s+=opening(54,314,12.8,9)+opening(186,314,12.8,-9);
    s+=neckBack();
    s+=part(torso,F('shirt'));
    s+=`<path d="M120,112 L120,336" stroke="#000" stroke-opacity=".2" stroke-width="1"/>`;
    for(let y=140;y<330;y+=34)s+=`<circle cx="120" cy="${y}" r="1.6" fill="#fff" stroke="#000" stroke-opacity=".25" stroke-width=".4"/>`;
  }
  if(o.tie){
    const knot='M112,94 L128,94 L125,110 L115,110 Z';
    const blade='M115,110 L125,110 L130,212 L120,224 L110,212 Z';
    // with a jacket on, the tie is only visible through the V opening; clip it so the tip never pokes past the lapels
    s+=o.top?`<clipPath id="vee-clip"><path d="${vee}"/></clipPath><g clip-path="url(#vee-clip)">`:'<g>';
    s+=part(blade,F('tie'));s+=part(knot,F('tie'));
    s+=`<path d="${blade}" fill="url(#silk)"/><path d="${knot}" fill="url(#silk)"/>`;
    s+=`<path d="M119,111 C119,118 120,124 120,130" stroke="#000" stroke-opacity=".3" stroke-width=".8" fill="none"/>`;
    s+='</g>';
  }
  s+=part(both(collarL),F('shirt'));

  if(o.top){
    /* lapels, closure, hem opening */
    s+=part(both(lapelL),F('top'));
    s+=`<path d="${both('M109,98 C111,140 115,190 120,228')}" stroke="#fff" stroke-opacity=".18" stroke-width="1" fill="none"/>`;
    s+=`<path d="${hemGap}" fill="${F('bot')}"/>`;
    s+=`<path d="M120,228 L120,298 C119,316 114,328 104,337 M120,298 C121,316 126,328 136,337" stroke="#000" stroke-opacity=".38" stroke-width=".9" fill="none"/>`;
    /* pockets */
    s+=`<path d="${both('M80,286 L106,288 L106,296 L80,294 Z')}" fill="${F('top')}" ${seam}/>`;
    s+=`<path d="M138,160 L160,157 L160,161 L138,164 Z" fill="${F('top')}" ${seam}/>`;
    /* buttons */
    const btn=lum(colOf(o.top))>.5?'#3a3530':'#141414';
    for(const y of [242,276])s+=`<circle cx="122" cy="${y}" r="2.6" fill="${btn}"/><circle cx="121.4" cy="${y-.6}" r="1" fill="#fff" opacity=".18"/>`;
    /* sleeves last so they overlap the body */
    s+=part(both(sleeveL),F('top'));
    for(const x of [58,61,64])s+=`<circle cx="${x}" cy="${306-(x-58)*.2}" r="1.1" fill="${btn}"/><circle cx="${240-x}" cy="${306-(x-58)*.2}" r="1.1" fill="${btn}"/>`;
  }

  /* accessories */
  if(o.clip&&o.tie){const m=METAL[o.clip.metal]||METAL.other;s+=`<rect x="111" y="170" width="18" height="2.4" rx="1" fill="${m}" stroke="#000" stroke-opacity=".3" stroke-width=".4"/>`}

  containerEl.innerHTML=s+'</svg>';
}

/* views */
const slots=o=>[[o.suitDay?'Suit':'Blazer',o.top],...(o.suitDay?[]:[['Pants',o.bot]]),['Shirt',o.shirt],['Tie',o.tie],['Tie clip',o.clip],['Watch',o.watch],['Belt',o.belt],['Socks',o.socks],['Shoes',o.shoes]]
.map(([l,i])=>`<div class="row"><span class="mut">${l}</span>${i?`<span class="dot" style='background:${bg(i)}'></span><span class="cap">${desc(i)}</span>`:'<span class="mut">Add one on the Add tab</span>'}</div>`).join('');

function planHtml(p){
  const f=new Date(view.y,view.m,1),days=[];
  for(const d=new Date(f);d.getMonth()===view.m;d.setDate(d.getDate()+1))if(d.getDay()<5)days.push(new Date(d));
  return `<div class="nav"><button onclick="mv(-1)" aria-label="Previous month">‹</button><h2>${f.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="mv(1)" aria-label="Next month">›</button></div>`+
  days.map(d=>{
    const o=p[key(d)]||{suitDay:true,top:null,bot:null,shirt:null,tie:null};
    return `<div class="pl ${key(d)===key(sel)?'on':''}" onclick="pick(${d.getTime()})"><b>${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</b><span class="cap">${o.suitDay?nm(o.top):nm(o.top)+' + '+nm(o.bot)}, ${o.shirt?primaryCol(o.shirt)+' shirt':'no shirt'}, ${o.tie?desc(o.tie)+' tie':'no tie'}</span></div>`;
  }).join('');
}

function renderToday(){
  closeSettings();
  const p=planFor();
  const o=p[key(sel)]||{suitDay:true,top:null,bot:null,shirt:null,tie:null,shoes:null,belt:null,socks:null,watch:null,clip:null};
  let h=`<div class="nav day"><button onclick="stepDay(-1)" aria-label="Previous day">‹</button><h2>${sel.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2><button onclick="stepDay(1)" aria-label="Next day">›</button></div>`;
  if(sel.getDay()>4)h+='<p class="mut">Nothing is scheduled on Fridays and Saturdays.</p>';
  else if(!items.length)h+='<p class="mut">Your wardrobe is empty. Add photos on the Add tab to get an outfit.</p>';
  else if(o)h+=`<div class="man" id="mannequin-container"></div>${o.top&&o.top.rest<COOL?`<p class="warn">This ${o.suitDay?'suit':'blazer'} was worn ${o.top.rest} day${o.top.rest===1?'':'s'} ago. Add more ${o.suitDay?'suits':'blazers'} to get a ${COOL}-day rest.</p>`:''}<div class="list">${slots(o)}</div>`;
  // everything after the date bar is the swipeable outfit
  const cut=h.indexOf('</div>')+6;
  $('#today').innerHTML=h.slice(0,cut)+`<div class="stage" id="stage"><div class="slide" id="slide">${h.slice(cut)}</div></div>`+planHtml(p);
  if(o && items.length && sel.getDay()<=4) {
    renderMannequinCanvas(o, $('#mannequin-container'));
  }
}

function mv(n){view.m+=n;if(view.m>11){view.m=0;view.y++}if(view.m<0){view.m=11;view.y--}const d=new Date(view.y,view.m,1);while(d.getDay()>4)d.setDate(d.getDate()+1);sel=d;renderToday()}
function pick(t){sel=new Date(t);renderToday();scrollTo(0,0)}
/* move to the next/previous scheduled day (Sunday-Thursday), crossing months as needed */
/* move to the next/previous scheduled day (Sunday-Thursday), crossing months as needed.
   from: where the new day's outfit slides in from (px, sign = side); 0 = no animation */
function stepDay(n,from){
  const d=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate());
  do d.setDate(d.getDate()+n);while(d.getDay()>4);
  sel=d;view={y:d.getFullYear(),m:d.getMonth()};renderToday();
  const sl=$('#slide');if(!sl)return;
  const x=from===undefined?(n>0?1:-1)*Math.min(innerWidth*.35,140):from;if(!x)return;
  sl.style.transition='none';sl.style.transform=`translateX(${x}px)`;sl.style.opacity='0';
  void sl.offsetWidth;
  sl.style.transition='transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s ease-out';sl.style.transform='translateX(0)';sl.style.opacity='1';
}
(()=>{const el=$('#today');let st=null;
  const slide=()=>$('#slide');
  el.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    // ignore multi-touch and touches that start at the screen edge (iOS back/forward gesture)
    // the gesture can start anywhere on Today (e.g. a Saturday shows only a one-line message); only the outfit moves
    st=e.touches.length>1||t.clientX<24||t.clientX>innerWidth-24?null:{x:t.clientX,y:t.clientY,t:Date.now(),lock:null,dx:0};
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!st)return;const t=e.touches[0],dx=t.clientX-st.x,dy=t.clientY-st.y;
    if(!st.lock&&(Math.abs(dx)>8||Math.abs(dy)>8))st.lock=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';
    if(st.lock!=='x')return;
    e.preventDefault(); // horizontal drag is ours: no page pan, no zoom bounce
    st.dx=dx;const sl=slide();if(sl){sl.style.transition='none';sl.style.transform=`translateX(${dx}px)`;sl.style.opacity=String(1-Math.min(.5,Math.abs(dx)/innerWidth))}
  },{passive:false});
  const end=()=>{
    if(!st)return;const {lock,dx,t}=st;st=null;const sl=slide();if(lock!=='x'||!sl)return;
    const fast=Math.abs(dx)/Math.max(1,Date.now()-t)>.5;
    if(Math.abs(dx)>70||(fast&&Math.abs(dx)>30)){
      const n=dx<0?1:-1,w=sl.offsetWidth||innerWidth;
      sl.style.transition='transform .16s ease-in,opacity .16s';sl.style.transform=`translateX(${dx<0?-w:w}px)`;sl.style.opacity='0';
      setTimeout(()=>stepDay(n,(dx<0?1:-1)*w*.6),160);
    }else{sl.style.transition='transform .2s ease-out,opacity .2s';sl.style.transform='translateX(0)';sl.style.opacity='1'}
  };
  el.addEventListener('touchend',end,{passive:true});el.addEventListener('touchcancel',end,{passive:true});
  document.addEventListener('keydown',e=>{if(el.hidden||e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight')stepDay(1);if(e.key==='ArrowLeft')stepDay(-1)});
})();

function renderWardrobe(){
  closeSettings();
  const cnt=t=>t==='all'?items.length:items.filter(i=>i.type===t).length;
  const chips=['all',...Object.keys(TYPES)].map(t=>`<button class="chip ${flt===t?'on':''}" onclick="flt='${t}';renderWardrobe()">${t==='all'?'All':TYPES[t]} ${cnt(t)}</button>`).join('');
  const list=items.filter(i=>flt==='all'||i.type===flt).sort((a,b)=>a.type.localeCompare(b.type)||b.added-a.added);
  $('#wardrobe').innerHTML=`<h2>Wardrobe</h2><div class="chips">${chips}</div>`+(list.length?`<div class="grid">${list.map(i=>`<div class="gi"${editing===i.id?' style="grid-column:1/-1"':''}>${i.photo?`<img class="ph" src="${i.photo}" alt="">`:itemThumb(i)}<b>${TYPES[i.type]||'Item'}</b><br><small class="cap">${desc(i)}</small><div class="btns"><button onclick="editing=editing==='${i.id}'?null:'${i.id}';renderWardrobe()">${editing===i.id?'Close':'Edit'}</button><button onclick="rm('${i.id}')">Delete</button></div>${editing===i.id?editForm(i):''}</div>`).join('')}</div>`:'<p class="mut">Nothing here yet. Add photos on the Add tab.</p>');
}

const S=(list,v,k,i)=>`<select onchange="setq(${i},'${k}',this.value)">${list.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select>`;

function renderAdd(){
  closeSettings();
  const workerSet = !!localStorage.getItem('worker_url');
  if($('#note')) $('#note').textContent = workerSet ? 'Photos are analyzed securely via your Cloudflare Worker AI.' : 'Worker URL not set! Tap ⚙ in the top right to configure your Cloudflare Worker.';
  if($('#queue')) $('#queue').innerHTML=queue.map((q,i)=>q.busy?'<div class="card">Analyzing photo with Cloudflare AI…</div>':q.err?`<div class="card">That image couldn’t be read. <button onclick="queue.splice(${i},1);renderAdd()">Dismiss</button></div>`:
`<div class="card">
<div class="rv">${q.photo?`<img class="ph" src="${q.photo}" alt="">`:itemThumb(q)}</div>
${FABRIC.includes(q.type)&&q.big?`
<div class="sw-box">
  <div id="swatch-img-${i}" class="sw" style="background-image:url(${q.swatch})"></div>
  <div style="flex:1;font-size:13px">
    <b>Precision Swatch Inspector</b>
    <label>Zoom: <input type="range" min="1" max="4" step="0.1" value="${q.zoom||1}" oninput="updateSwatchParam(${i}, 'zoom', this.value)"></label>
    <label>X-Pos: <input type="range" min="0" max="1" step="0.05" value="${q.cx||0.5}" oninput="updateSwatchParam(${i}, 'cx', this.value)"></label>
    <label>Y-Pos: <input type="range" min="0" max="1" step="0.05" value="${q.cy||0.5}" oninput="updateSwatchParam(${i}, 'cy', this.value)"></label>
  </div>
</div>`:''}
<label>Item ${S(Object.entries(TYPES),q.type,'type',i)}</label>
<label>Primary Colour ${S(Object.keys(COLORS).map(c=>[c,c]),q.primaryColor,'primaryColor',i)}</label>
<label>Secondary Colour ${S([['none','None'], ...Object.keys(COLORS).map(c=>[c,c])],q.secondaryColor||'none','secondaryColor',i)}</label>
<label>Tertiary Colour ${S([['none','None'], ...Object.keys(COLORS).map(c=>[c,c])],q.tertiaryColor||'none','tertiaryColor',i)}</label>
${FABRIC.includes(q.type)?`<label>Pattern ${S((PATS_BY[q.type]||['solid']).map(c=>[c,patLabel(c)]),q.pattern,'pattern',i)}</label>`:''}${q.type==='watch'||q.type==='tieclip'?`<label>Metal ${S(Object.keys(METAL).map(c=>[c,c]),q.metal,'metal',i)}</label>`:''}
${q.type==='shoes'?`<label>Leather ${S(LEATHERS.map(c=>[c,patLabel(c)]),q.leather||'calf','leather',i)}</label>`:''}
${q.type==='watch'?`<label>Dial ${S(Object.keys(COLORS).map(c=>[c,c]),watchOpts(q).dial,'dial',i)}</label><label>Band ${S(BANDS,watchOpts(q).band,'band',i)}</label><label>Bezel ${S(BEZELS,watchOpts(q).bezel,'bezel',i)}</label><label>Style ${S(WATCH_STYLES,watchOpts(q).style,'watchStyle',i)}</label>`:''}
<div class="btns"><button class="pri" onclick="save(${i})">Confirm</button><button onclick="queue.splice(${i},1);renderAdd()">${q.manual?'Cancel':'Skip'}</button></div>${q.manual?'':'<small>Cloudflare AI.</small>'}</div>`).join('');
}

function show(t){
  closeSettings();
  for(const s of['today','wardrobe','add']){const el=$('#'+s);if(el)el.hidden=s!==t;const btn=$('#n-'+s);if(btn)btn.classList.toggle('on',s===t)}
  const f={today:renderToday,wardrobe:renderWardrobe,add:renderAdd};if(f[t])f[t]();
}

db.then(()=>tx('readonly',s=>s.getAll())).then(r=>{items=r||[];show('today')}).catch(e=>{items=[];show('today')});
