<style>

</style></head><body>
<header><h1>Daily Wardrobe</h1><button onclick="openSettings()" aria-label="Settings">⚙</button></header>
<main>
<section id="today"></section>
<section id="wardrobe" hidden></section>
<section id="add" hidden><h2>Add to wardrobe</h2><p id="note" class="mut"></p>
<label class="btn pri">Choose photos<input type="file" accept="image/*" multiple hidden onchange="addFiles([...this.files]);this.value=''"></label>
<div id="queue"></div></section>
</main>
<nav><button id="n-today" onclick="show('today')">Today</button><button id="n-wardrobe" onclick="show('wardrobe')">Wardrobe</button><button id="n-add" onclick="show('add')">Add</button></nav>

<div id="modal-backdrop" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;pointer-events:none;" onclick="closeSettings()"></div>
<div id="settings-modal" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:90%;max-width:400px;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,0.5);pointer-events:none;">
<h2>Settings</h2>
<p class="mut"><small>Configure your Cloudflare Worker backend for AI photo recognition.</small></p>
<label style="display:block;margin:10px 0">Worker URL:<br><input type="text" id="cfg-url" placeholder="https://your-worker.workers.dev"></label>
<label style="display:block;margin:10px 0">App Token:<br><input type="text" id="cfg-token" placeholder="Your secret token"></label>
<div class="btns"><button class="pri" onclick="saveSettings()">Save</button><button onclick="closeSettings()">Cancel</button></div>
</div>

<script>
const TYPES={suit:'Suit',blazer:'Blazer',pants:'Dress pants',shirt:'Dress shirt',tie:'Tie',tieclip:'Tie clip',watch:'Watch',shoes:'Shoes',belt:'Belt',socks:'Socks'};
const COLORS={black:'#16161a',charcoal:'#3b3f46',grey:'#8b8f96',white:'#f6f6f3',cream:'#efe4c8',lightblue:'#a9c7e4',blue:'#3f6fb5',navy:'#1b2a4a',brown:'#5a3a22',tan:'#b8946a',olive:'#5b5d36',green:'#2f6b4a',burgundy:'#6d1f2c',red:'#b3262e',purple:'#5d3a7a',pink:'#e3a5b4',gold:'#c9a227',silver:'#c3c6cb'};
const METAL={gold:'#c9a227',silver:'#c3c6cb',other:'#7d8187'},PATS=['solid','stripe','check','polka-dot','paisley','texture','other'],FABRIC=['suit','blazer','pants','shirt','tie'],COOL=3;
const $=s=>document.querySelector(s),key=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),di=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
let items=[],flt='all',queue=[];const now=new Date();let view={y:now.getFullYear(),m:now.getMonth()},sel=new Date(now.getFullYear(),now.getMonth(),now.getDate());

/* storage */
const db=new Promise((ok,no)=>{const r=indexedDB.open('wardrobe',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('items',m);const q=f(t.objectStore('items'));t.oncomplete=()=>ok(q.result);t.onerror=no})};
const put=i=>tx('readwrite',s=>s.put(i)),del=id=>tx('readwrite',s=>s.delete(id));

/* settings management */
function openSettings(){
  if($('#cfg-url')) $('#cfg-url').value=localStorage.getItem('worker_url')||'';
  if($('#cfg-token')) $('#cfg-token').value=localStorage.getItem('app_token')||'';
  if($('#settings-modal')){ $('#settings-modal').style.display='block'; $('#settings-modal').style.pointerEvents='auto'; }
  if($('#modal-backdrop')){ $('#modal-backdrop').style.display='block'; $('#modal-backdrop').style.pointerEvents='auto'; }
}
function closeSettings(){
  if($('#settings-modal')){ $('#settings-modal').style.display='none'; $('#settings-modal').style.pointerEvents='none'; }
  if($('#modal-backdrop')){ $('#modal-backdrop').style.display='none'; $('#modal-backdrop').style.pointerEvents='none'; }
}
function saveSettings(){
  if($('#cfg-url')) localStorage.setItem('worker_url',$('#cfg-url').value.trim());
  if($('#cfg-token')) localStorage.setItem('app_token',$('#cfg-token').value.trim());
  closeSettings();
  renderAdd();
}

/* precision swatch generator */
function generateSwatch(q){
  if(!q.big) return '';
  const canvas=q.big;
  const zoom=Number(q.zoom)||1;
  const cx=Number(q.cx)||0.5;
  const cy=Number(q.cy)||0.5;
  const sampleSize=Math.min(canvas.width,canvas.height)*(0.5/zoom);
  const o=document.createElement('canvas');
  o.width=o.height=128;
  const sx=Math.max(0,Math.min(canvas.width-sampleSize,cx*canvas.width-sampleSize/2));
  const sy=Math.max(0,Math.min(canvas.height-sampleSize,cy*canvas.height-sampleSize/2));
  o.getContext('2d').drawImage(canvas, sx, sy, sampleSize, sampleSize, 0, 0, 128, 128);
  q.swatch=o.toDataURL('image/png');
  return q.swatch;
}

function updateSwatchParam(i, param, val){
  queue[i][param]=Number(val);
  generateSwatch(queue[i]);
  const swEl=$(`#swatch-img-${i}`);
  if(swEl) swEl.style.backgroundImage=`url(${queue[i].swatch})`;
}

async function ask(c){
  try {
    const workerUrl=localStorage.getItem('worker_url');
    if(!workerUrl) return null;
    const dataUrl=c.toDataURL('image/jpeg',.8);
    const res=await fetch(workerUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:dataUrl,appToken:localStorage.getItem('app_token')||''})
    });
    if(!res.ok) return null;
    const result=await res.json();
    let parsed;
    try {
      const cleanText=(result.response||'').replace(/```json/g,'').replace(/```/g, '').trim();
      parsed=JSON.parse(cleanText);
    } catch(e) {
      parsed=result;
    }
    return {
      type:TYPES[parsed.type]?parsed.type:'suit',
      primaryColor:COLORS[parsed.primaryColor||parsed.color]?parsed.primaryColor||parsed.color:'grey',
      secondaryColor:(parsed.secondaryColor&&parsed.secondaryColor!=='none'&&COLORS[parsed.secondaryColor])?parsed.secondaryColor:null,
      tertiaryColor:(parsed.tertiaryColor&&parsed.tertiaryColor!=='none'&&COLORS[parsed.tertiaryColor])?parsed.tertiaryColor:null,
      pattern:PATS.includes(parsed.pattern)?parsed.pattern:'solid',
      metal:METAL[parsed.metal]?parsed.metal:'silver'
    };
  } catch(e) {
    return null;
  }
}

const loadImg=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
function shrink(img,max){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}

async function fill(q,ai){
  q.zoom=1; q.cx=0.5; q.cy=0.5;
  generateSwatch(q);
  q.ai=!!(ai&&ai.type);
  q.type=q.ai?ai.type:'suit';
  q.primaryColor=ai&&COLORS[ai.primaryColor]?ai.primaryColor:'grey';
  q.secondaryColor=ai&&ai.secondaryColor&&ai.secondaryColor!=='none'?ai.secondaryColor:null;
  q.tertiaryColor=ai&&ai.tertiaryColor&&ai.tertiaryColor!=='none'?ai.tertiaryColor:null;
  q.pattern=ai&&PATS.includes(ai.pattern)?ai.pattern:'solid';
  q.metal=ai&&METAL[ai.metal]?ai.metal:'silver';
}

async function addFiles(files){
  for(const f of files){
    const q={id:crypto.randomUUID(),busy:1};
    queue.push(q);
    renderAdd();
    try{
      const img=await loadImg(f);
      q.big=shrink(img,800);
      q.photo=shrink(img,360).toDataURL('image/jpeg',.8);
      const aiResult=await ask(q.big);
      fill(q,aiResult);
    }catch(e){q.err=1}
    q.busy=0;
    renderAdd();
  }
}

const setq=(i,k,v)=>{queue[i][k]=v==='none'?null:v;if(k==='type')renderAdd()};
async function save(i){
  const q=queue[i],f=FABRIC.includes(q.type);
  generateSwatch(q);
  const it={id:q.id,type:q.type,primaryColor:q.primaryColor,secondaryColor:q.secondaryColor,tertiaryColor:q.tertiaryColor,pattern:f?q.pattern:'solid',photo:q.photo,added:Date.now()};
  if(f)it.swatch=q.swatch;
  if(q.type==='watch'||q.type==='tieclip')it.metal=q.metal;
  await put(it);items.push(it);queue.splice(i,1);renderAdd();
}
async function rm(id){if(!confirm('Delete this item?'))return;await del(id);items=items.filter(i=>i.id!==id);renderWardrobe()}

/* matching logic & helpers */
const primaryCol=i=>i?i.primaryColor||i.color||'grey':'grey';
const colorDesc = i => {
  if(!i) return '';
  let cols=[primaryCol(i)];
  if(i.secondaryColor&&i.secondaryColor!=='none') cols.push(i.secondaryColor);
  if(i.tertiaryColor&&i.tertiaryColor!=='none') cols.push(i.tertiaryColor);
  return cols.join(' & ');
};
const desc=i=>i?colorDesc(i)+(i.pattern&&i.pattern!=='solid'?' '+i.pattern:'')+(i.metal?' · '+i.metal:''):'';
const nm=i=>i?colorDesc(i)+(i.pattern&&i.pattern!=='solid'?' '+i.pattern:'')+' '+(TYPES[i.type]||'item').toLowerCase():'none';
const bg=i=>i?(i.swatch?`url(${i.swatch})`:COLORS[primaryCol(i)]||METAL[i.metal]||'#ccc'):'#ccc';

const LUM=i=>{const h=COLORS[primaryCol(i)];return h?(parseInt(h.slice(1,3),16)*.3+parseInt(h.slice(3,5),16)*.59+parseInt(h.slice(5,7),16)*.11):128};
const pw=i=>i?({solid:0,texture:.5}[i.pattern]??1):0;
const clash=(a,b)=>a&&b&&pw(a)>=1&&pw(b)>=1?(a.pattern===b.pattern?-40:-25):0;
const HARM={navy:['burgundy','red','gold','grey','lightblue','green','purple','pink'],charcoal:['burgundy','red','purple','navy','lightblue','pink'],grey:['navy','burgundy','blue','purple','pink'],black:['red','grey','burgundy','purple'],brown:['green','gold','navy','tan','burgundy','cream'],tan:['navy','brown','burgundy','green'],olive:['brown','burgundy','navy','gold','cream'],blue:['navy','burgundy','grey','gold']};
const SH={black:['black','charcoal','grey','navy'],charcoal:['black','burgundy','brown'],grey:['black','brown','burgundy'],navy:['brown','burgundy','black','tan'],brown:['brown','tan','burgundy'],tan:['brown','tan','burgundy'],olive:['brown','tan','burgundy'],blue:['brown','black']};
const shirtScore=(t,s)=>{if(!t)return 0;const pc=primaryCol(s),tc=primaryCol(t);let v=({white:4,lightblue:3,cream:1,pink:1})[pc]??-6;if(pc===tc)v-=25;if(tc==='black'&&pc!=='white')v-=8;return v+clash(t,s)};
function tieScore(t,sh,x){let v=0;if(t){const xc=primaryCol(x),tc=primaryCol(t);if(xc===tc)v-=15;if(HARM[tc])v+=HARM[tc].includes(xc)?5:-2;v+=clash(t,x)/2}
if(sh){const xc=primaryCol(x),shc=primaryCol(sh);if(xc===shc)v-=15;if(xc==='blue'&&shc==='lightblue')v-=6;if(Math.abs(LUM(x)-LUM(sh))>60)v+=3;v+=clash(sh,x)/2}if(pw(t)+pw(sh)>=2&&pw(x)>=1)v-=30;return v}
const pairScore=(t,p)=>{if(!t)return 0;const tc=primaryCol(t),pc=primaryCol(p);let v=0;if(pc===tc)v-=30;if((tc==='black')!==(pc==='black'))v-=20;if(!['grey','charcoal','tan','navy','olive','brown','black'].includes(pc))v-=20;return v+clash(t,p)};
const WARM=['brown','tan','olive'];
const shoeScore=(t,b,s)=>{if(!b)return 0;const sc=primaryCol(s),bc=primaryCol(b),tc=t?primaryCol(t):'';const k=(SH[bc]||['black','brown']).indexOf(sc);let v=k<0?-50:6-k*2;if(t&&((WARM.includes(tc)&&sc==='black')||(tc==='black'&&['brown','tan'].includes(sc))))v-=50;return v};
const beltScore=(sh,b)=>!sh?0:primaryCol(b)===primaryCol(sh)?10:['brown','tan'].includes(primaryCol(b))&&['brown','tan'].includes(primaryCol(sh))?5:-10;
const sockScore=(bot,sh,s)=>{const sc=primaryCol(s),botc=bot?primaryCol(bot):'',shc=sh?primaryCol(sh):'';let v=s.pattern==='solid'?2:0;if(bot&&sc===botc)v+=8;else if(sh&&sc===shc)v+=4;else if(bot)v+=(WARM.includes(botc)?['brown','tan','olive']:['black','navy','charcoal','grey']).includes(sc)?3:-8;if(bot&&['white','cream','pink','lightblue'].includes(sc))v-=10;return v};

function outfit(suitDay,n,by,last){const rest=i=>Math.min(n-(last[i.id]??-1e5),60);
const best=(arr,sc)=>{let b=null,bs=-1e9;for(const i of arr){const s=sc(i)+Math.min(rest(i),10)*.4;if(s>bs){bs=s;b=i}}if(!b)return null;const c={...b,rest:rest(b)};last[b.id]=n;return c};
const top=best(by(suitDay?'suit':'blazer'),i=>rest(i)*3),bot=suitDay?top:best(by('pants'),p=>pairScore(top,p));
const shirt=best(by('shirt'),s=>shirtScore(top,s)),tie=best(by('tie'),t=>tieScore(top,shirt,t)),shoes=best(by('shoes'),s=>shoeScore(top,bot,s));
const belt=best(by('belt'),b=>beltScore(shoes,b)),socks=best(by('socks'),s=>sockScore(bot,shoes,s)),watch=best(by('watch'),()=>0);
const clip=best(by('tieclip'),c=>watch&&c.metal===watch.metal?6:0);return{suitDay,top,bot,shirt,tie,shoes,belt,socks,watch,clip}}
function buildPlan(y,m){const by=t=>items.filter(i=>i.type===t).sort((a,b)=>a.id<b.id?-1:1),last={},plan={};
for(const d=new Date(y,m,-13);d<=new Date(y,m+1,0);d.setDate(d.getDate()+1)){const w=d.getDay();if(w<5)plan[key(d)]=outfit(w<4,di(d),by,last)}return plan}
let cache={}; const planFor=()=>cache[view.y+'-'+view.m]||(cache[view.y+'-'+view.m]=buildPlan(view.y,view.m));

/* HTML5 Canvas Mannequin Renderer with Advanced 3D Lighting & Shading */
async function renderMannequinCanvas(o, containerEl) {
  containerEl.innerHTML = '<canvas id="man-canvas" width="220" height="522"></canvas>';
  const canvas = $('#man-canvas');
  const ctx = canvas.getContext('2d');

  // Helper to load image for canvas pattern
  const loadPatternImage = src => new Promise(resolve => {
    if(!src) return resolve(null);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });

  const topImg = o.top ? await loadPatternImage(o.top.swatch) : null;
  const botImg = o.bot ? await loadPatternImage(o.bot.swatch) : null;
  const shirtImg = o.shirt ? await loadPatternImage(o.shirt.swatch) : null;
  const tieImg = o.tie ? await loadPatternImage(o.tie.swatch) : null;

  // Floor shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(110, 516, 72, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head and neck
  ctx.fillStyle = '#d8d3c9';
  ctx.beginPath();
  ctx.arc(110, 38, 21, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(101, 60, 18, 22);

  // Hands
  ctx.beginPath();
  ctx.arc(41, 290, 9, 0, Math.PI * 2);
  ctx.arc(179, 290, 9, 0, Math.PI * 2);
  ctx.fillStyle = '#d8d3c9';
  ctx.fill();

  // Draw Function with Fill/Pattern & 3D Lighting Overlay
  const drawGarment = (pathFn, item, fallbackColor) => {
    ctx.save();
    ctx.beginPath();
    pathFn(ctx);
    ctx.closePath();

    if (item && item.swatch && ((item === o.top && topImg) || (item === o.bot && botImg) || (item === o.shirt && shirtImg) || (item === o.tie && tieImg))) {
      const img = item === o.top ? topImg : item === o.bot ? botImg : item === o.shirt ? shirtImg : tieImg;
      const pat = ctx.createPattern(img, 'repeat');
      ctx.fillStyle = pat;
    } else {
      ctx.fillStyle = item ? (COLORS[primaryCol(item)] || fallbackColor) : fallbackColor;
    }
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 3D Contour Lighting Gradient (Overlay Blend)
    ctx.globalCompositeOperation = 'overlay';
    const grad = ctx.createLinearGradient(30, 0, 190, 0);
    grad.addColorStop(0, 'rgba(0,0,0,0.3)');
    grad.addColorStop(0.3, 'rgba(255,255,255,0.15)');
    grad.addColorStop(0.7, 'rgba(255,255,255,0.05)');
    grad.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    pathFn(ctx);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  };

  // 1. Pants / Bottoms
  drawGarment(c => {
    c.moveTo(64, 296); c.lineTo(110, 296); c.lineTo(106, 470); c.lineTo(72, 470); c.closePath();
    c.moveTo(110, 296); c.lineTo(156, 296); c.lineTo(148, 470); c.lineTo(114, 470); c.closePath();
  }, o.bot, '#cfcac0');

  // Socks & Shoes
  const skCol = o.socks ? COLORS[primaryCol(o.socks)] || '#cfcac0' : '#cfcac0';
  const shCol = o.shoes ? COLORS[primaryCol(o.shoes)] || '#cfcac0' : '#cfcac0';
  ctx.fillStyle = skCol;
  ctx.fillRect(78, 468, 22, 22);
  ctx.fillRect(120, 468, 22, 22);

  ctx.fillStyle = shCol;
  ctx.beginPath();
  ctx.moveTo(76, 488); ctx.lineTo(102, 488); ctx.lineTo(102, 503); ctx.quadraticCurveTo(102, 511, 92, 511); ctx.lineTo(56, 511); ctx.quadraticCurveTo(54, 499, 68, 496); ctx.closePath();
  ctx.moveTo(144, 488); ctx.lineTo(118, 488); ctx.lineTo(118, 503); ctx.quadraticCurveTo(118, 511, 128, 511); ctx.lineTo(164, 511); ctx.quadraticCurveTo(166, 499, 152, 496); ctx.closePath();
  ctx.fill();

  // 2. Shirt
  drawGarment(c => {
    c.moveTo(92, 78); c.lineTo(128, 78); c.lineTo(150, 100); c.lineTo(150, 270); c.lineTo(70, 270); c.lineTo(70, 100); c.closePath();
  }, o.shirt, '#f6f6f3');

  // Shirt Collar & Cuffs
  ctx.fillStyle = o.shirt ? COLORS[primaryCol(o.shirt)] || '#f6f6f3' : '#f6f6f3';
  ctx.beginPath();
  ctx.moveTo(98, 78); ctx.lineTo(110, 98); ctx.lineTo(88, 96); ctx.closePath();
  ctx.moveTo(122, 78); ctx.lineTo(110, 98); ctx.lineTo(132, 96); ctx.closePath();
  ctx.fill();

  ctx.fillRect(30, 266, 22, 7);
  ctx.fillRect(168, 266, 22, 7);

  // 3. Tie
  if (o.tie) {
    drawGarment(c => {
      c.moveTo(104, 92); c.lineTo(116, 92); c.lineTo(114, 103); c.lineTo(106, 103); c.closePath();
      c.moveTo(106, 103); c.lineTo(114, 103); c.lineTo(121, 191); c.lineTo(110, 206); c.lineTo(99, 191); c.closePath();
    }, o.tie, '#3f6fb5');
  }

  // 4. Suit / Blazer Top
  drawGarment(c => {
    c.moveTo(58, 102); c.lineTo(38, 110); c.lineTo(30, 268); c.lineTo(52, 268); c.lineTo(66, 130); c.closePath();
    c.moveTo(162, 102); c.lineTo(182, 110); c.lineTo(190, 268); c.lineTo(168, 268); c.lineTo(154, 130); c.closePath();
    c.moveTo(64, 98); c.lineTo(98, 84); c.lineTo(110, 170); c.lineTo(110, 300); c.lineTo(62, 300); c.lineTo(56, 112); c.closePath();
    c.moveTo(156, 98); c.lineTo(122, 84); c.lineTo(110, 170); c.lineTo(110, 300); c.lineTo(158, 300); c.lineTo(164, 112); c.closePath();
  }, o.top, '#1b2a4a');

  // Watch & Tie Clip
  if (o.watch) {
    const wm = METAL[o.watch.metal] || METAL.other;
    ctx.fillStyle = wm;
    ctx.fillRect(168, 277, 22, 8);
    ctx.beginPath(); ctx.arc(179, 281, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(179, 281, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#101820'; ctx.fill();
  }
  if (o.clip) {
    const cm = METAL[o.clip.metal] || METAL.other;
    ctx.fillStyle = cm;
    ctx.fillRect(104, 132, 12, 3);
  }
}

/* views */
const slots=o=>[[o.suitDay?'Suit':'Blazer',o.top],...(o.suitDay?[]:[['Pants',o.bot]]),['Shirt',o.shirt],['Tie',o.tie],['Tie clip',o.clip],['Watch',o.watch],['Belt',o.belt],['Socks',o.socks],['Shoes',o.shoes]]
.map(([l,i])=>`<div class="row"><span class="mut">${l}</span>${i?`<span class="dot" style='background:${bg(i)}'></span><span class="cap">${desc(i)}</span>`:'<span class="mut">Add one on the Add tab</span>'}</div>`).join('');

function planHtml(p){
  const f=new Date(view.y,view.m,1),days=[];
  for(const d=new Date(f);d.getMonth()===view.m;d.setDate(d.getDate()+1))if(d.getDay()<5)days.push(new Date(d));
  return `<div class="nav"><button onclick="mv(-1)" aria-label="Previous month">‹</button><h2>${f.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="mv(1)" aria-label="Next month">›</button></div>`+
  days.map(d=>{
    const o=p[key(d)]||{suitDay:true,top:null,bot:null,shirt:null,tie:null};
    return `<div class="pl ${key(d)===key(sel)?'on':''}" onclick="pick(${d.getTime()})"><b>${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</b><span class="cap">${o.suitDay?nm(o.top):nm(o.top)+' + '+nm(o.bot)}, ${o.shirt?primaryCol(o.shirt)+' shirt':'no shirt'}, ${o.tie?desc(o.tie)+' tie':'no tie'}</span></div>`;
  }).join('');
}

function renderToday(){
  closeSettings();
  const p=planFor();
  const o=p[key(sel)]||{suitDay:true,top:null,bot:null,shirt:null,tie:null,shoes:null,belt:null,socks:null,watch:null,clip:null};
  let h=`<h2>${sel.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2>`;
  if(sel.getDay()>4)h+='<p class="mut">Nothing is scheduled on Fridays and Saturdays.</p>';
  else if(!items.length)h+='<p class="mut">Your wardrobe is empty. Add photos on the Add tab to get an outfit.</p>';
  else if(o)h+=`<div class="man" id="mannequin-container"></div>${o.top&&o.top.rest<COOL?`<p class="warn">This ${o.suitDay?'suit':'blazer'} was worn ${o.top.rest} day${o.top.rest===1?'':'s'} ago. Add more ${o.suitDay?'suits':'blazers'} to get a ${COOL}-day rest.</p>`:''}<div class="list">${slots(o)}</div>`;
  $('#today').innerHTML=h+planHtml(p);
  if(o && items.length && sel.getDay()<=4) {
    renderMannequinCanvas(o, $('#mannequin-container'));
  }
}

function mv(n){view.m+=n;if(view.m>11){view.m=0;view.y++}if(view.m<0){view.m=11;view.y--}const d=new Date(view.y,view.m,1);while(d.getDay()>4)d.setDate(d.getDate()+1);sel=d;renderToday()}
function pick(t){sel=new Date(t);renderToday();scrollTo(0,0)}

function renderWardrobe(){
  closeSettings();
  const cnt=t=>t==='all'?items.length:items.filter(i=>i.type===t).length;
  const chips=['all',...Object.keys(TYPES)].map(t=>`<button class="chip ${flt===t?'on':''}" onclick="flt='${t}';renderWardrobe()">${t==='all'?'All':TYPES[t]} ${cnt(t)}</button>`).join('');
  const list=items.filter(i=>flt==='all'||i.type===flt).sort((a,b)=>a.type.localeCompare(b.type)||b.added-a.added);
  $('#wardrobe').innerHTML=`<h2>Wardrobe</h2><div class="chips">${chips}</div>`+(list.length?`<div class="grid">${list.map(i=>`<div class="gi"><img class="ph" src="${i.photo}" alt=""><b>${TYPES[i.type]||'Item'}</b><br><small class="cap">${desc(i)}</small><div class="btns"><button onclick="rm('${i.id}')">Delete</button></div></div>`).join('')}</div>`:'<p class="mut">Nothing here yet. Add photos on the Add tab.</p>');
}

const S=(list,v,k,i)=>`<select onchange="setq(${i},'${k}',this.value)">${list.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select>`;

function renderAdd(){
  closeSettings();
  const workerSet = !!localStorage.getItem('worker_url');
  if($('#note')) $('#note').textContent = workerSet ? 'Photos are analyzed securely via your Cloudflare Worker AI.' : 'Worker URL not set! Tap ⚙ in the top right to configure your Cloudflare Worker.';
  if($('#queue')) $('#queue').innerHTML=queue.map((q,i)=>q.busy?'<div class="card">Analyzing photo with Cloudflare AI…</div>':q.err?`<div class="card">That image couldn’t be read. <button onclick="queue.splice(${i},1);renderAdd()">Dismiss</button></div>`:
`<div class="card">
<div class="rv"><img class="ph" src="${q.photo}" alt=""></div>
${FABRIC.includes(q.type)?`
<div class="sw-box">
  <div id="swatch-img-${i}" class="sw" style="background-image:url(${q.swatch})"></div>
  <div style="flex:1;font-size:13px">
    <b>Precision Swatch Inspector</b>
    <label>Zoom: <input type="range" min="1" max="4" step="0.1" value="${q.zoom||1}" oninput="updateSwatchParam(${i}, 'zoom', this.value)"></label>
    <label>X-Pos: <input type="range" min="0" max="1" step="0.05" value="${q.cx||0.5}" oninput="updateSwatchParam(${i}, 'cx', this.value)"></label>
    <label>Y-Pos: <input type="range" min="0" max="1" step="0.05" value="${q.cy||0.5}" oninput="updateSwatchParam(${i}, 'cy', this.value)"></label>
  </div>
</div>`:''}
<label>Item ${S(Object.entries(TYPES),q.type,'type',i)}</label>
<label>Primary Colour ${S(Object.keys(COLORS).map(c=>[c,c]),q.primaryColor,'primaryColor',i)}</label>
<label>Secondary Colour ${S([['none','None'], ...Object.keys(COLORS).map(c=>[c,c])],q.secondaryColor||'none','secondaryColor',i)}</label>
<label>Tertiary Colour ${S([['none','None'], ...Object.keys(COLORS).map(c=>[c,c])],q.tertiaryColor||'none','tertiaryColor',i)}</label>
${FABRIC.includes(q.type)?`<label>Pattern ${S(PATS.map(c=>[c,c]),q.pattern,'pattern',i)}</label>`:''}${q.type==='watch'||q.type==='tieclip'?`<label>Metal ${S(Object.keys(METAL).map(c=>[c,c]),q.metal,'metal',i)}</label>`:''}
<div class="btns"><button class="pri" onclick="save(${i})">Confirm</button><button onclick="queue.splice(${i},1);renderAdd()">Skip</button></div><small>Cloudflare AI.</small></div>`).join('');
}

function show(t){
  closeSettings();
  for(const s of['today','wardrobe','add']){const el=$('#'+s);if(el)el.hidden=s!==t;const btn=$('#n-'+s);if(btn)btn.classList.toggle('on',s===t)}
  const f={today:renderToday,wardrobe:renderWardrobe,add:renderAdd};if(f[t])f[t]();
}

db.then(()=>tx('readonly',s=>s.getAll())).then(r=>{items=r||[];show('today')}).catch(e=>{items=[];show('today')});
</script></body></html>
