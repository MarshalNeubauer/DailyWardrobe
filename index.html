<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101820">
<title>Daily Wardrobe</title>
<style>
:root{--bg:#e8ebec;--card:#fbfbf8;--ink:#101820;--mut:#5d6872;--acc:#d9a21b;--line:#cdd3d6}
@media(prefers-color-scheme:dark){:root{--bg:#0d141b;--card:#16202a;--ink:#e9eef0;--mut:#93a0aa;--line:#26333f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 18px 14px;background:#101820 repeating-linear-gradient(90deg,transparent 0 11px,#ffffff14 11px 12px);color:#f2f0e8}
h1,h2{margin:0;font-weight:700;letter-spacing:-.01em}h1{font-size:21px}h2{font-size:19px}
main{padding:16px;max-width:560px;margin:auto}
.mut,small{color:var(--mut)}.cap{text-transform:capitalize}
button,.btn,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header button{background:none;border:0;color:inherit;font-size:22px}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{display:inline-block;padding:12px 18px;border-radius:10px;border:1px solid var(--line);cursor:pointer;margin:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:16px 0;font-weight:600;color:var(--mut)}
nav button.on{color:var(--ink);box-shadow:inset 0 3px var(--acc)}
.man svg{display:block;margin:6px auto;width:min(250px,68vw)}
.list{background:var(--card);border-radius:14px;padding:6px 14px;margin:8px 0 20px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .mut{width:68px;flex:none}
.dot{width:24px;height:24px;border-radius:6px;border:1px solid #0003;flex:none;background-size:cover}
.warn{background:#d9a21b22;border-left:4px solid var(--acc);padding:8px 12px;border-radius:4px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.pl{display:flex;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;align-items:baseline}
.pl b{width:54px;flex:none}.pl.on{background:var(--card);box-shadow:inset 3px 0 var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{border-radius:99px;white-space:nowrap;padding:5px 12px}.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gi,.card{background:var(--card);border-radius:14px;padding:10px;margin:10px 0}.gi{margin:0}
.gi img.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.card label{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
select{padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--bg);max-width:60%}
.rv{display:flex;gap:10px;align-items:flex-start}.rv .ph{width:62%;border-radius:8px}.sw{width:56px;height:56px;border-radius:8px;border:1px solid #0003}
.btns{display:flex;gap:8px;margin:10px 0 4px}
</style></head><body>
<header><h1>Daily Wardrobe</h1></header>
<main>
<section id="today"></section>
<section id="wardrobe" hidden></section>
<section id="add" hidden><h2>Add to wardrobe</h2><p id="note" class="mut"></p>
<label class="btn pri">Choose photos<input type="file" accept="image/*" multiple hidden onchange="addFiles([...this.files]);this.value=''"></label>
<div id="queue"></div></section>
</main>
<nav><button id="n-today" onclick="show('today')">Today</button><button id="n-wardrobe" onclick="show('wardrobe')">Wardrobe</button><button id="n-add" onclick="show('add')">Add</button></nav>
<script>
const TYPES={suit:'Suit',blazer:'Blazer',pants:'Dress pants',shirt:'Dress shirt',tie:'Tie',tieclip:'Tie clip',watch:'Watch',shoes:'Shoes',belt:'Belt',socks:'Socks'};
const COLORS={black:'#16161a',charcoal:'#3b3f46',grey:'#8b8f96',white:'#f6f6f3',cream:'#efe4c8',lightblue:'#a9c7e4',blue:'#3f6fb5',navy:'#1b2a4a',brown:'#5a3a22',tan:'#b8946a',olive:'#5b5d36',green:'#2f6b4a',burgundy:'#6d1f2c',red:'#b3262e',purple:'#5d3a7a',pink:'#e3a5b4',gold:'#c9a227',silver:'#c3c6cb'};
const METAL={gold:'#c9a227',silver:'#c3c6cb',other:'#7d8187'},PATS=['solid','texture','stripe','check','other'],FABRIC=['suit','blazer','pants','shirt','tie'],COOL=3;
const $=s=>document.querySelector(s),key=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),di=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
let items=[],flt='all',queue=[],cache={};const now=new Date();let view={y:now.getFullYear(),m:now.getMonth()},sel=new Date(now.getFullYear(),now.getMonth(),now.getDate());

/* storage (IndexedDB, stays on this device) */
const db=new Promise((ok,no)=>{const r=indexedDB.open('wardrobe',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('items',m);const q=f(t.objectStore('items'));t.oncomplete=()=>ok(q.result);t.onerror=no})};
const put=i=>tx('readwrite',s=>s.put(i)),del=id=>tx('readwrite',s=>s.delete(id));

/* photo analysis */
const loadImg=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
function shrink(img,max){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
function swatchOf(c,cx,cy){const s=Math.min(c.width,c.height)*.28,o=document.createElement('canvas');o.width=o.height=64;o.getContext('2d').drawImage(c,Math.max(0,Math.min(c.width-s,cx*c.width-s/2)),Math.max(0,Math.min(c.height-s,cy*c.height-s/2)),s,s,0,0,64,64);return o}
function nameColor(r,g,b){r/=255;g/=255;b/=255;const x=Math.max(r,g,b),n=Math.min(r,g,b),l=(x+n)/2,d=x-n,s=d?d/(1-Math.abs(2*l-1)):0;let h=0;if(d){h=x===r?((g-b)/d+6)%6:x===g?(b-r)/d+2:(r-g)/d+4;h*=60}
if(l<.12)return'black';if(s<.14)return l>.86?'white':l<.3?'charcoal':'grey';
if(l>.85)return h>=190&&h<250?'lightblue':h>=25&&h<65?'cream':(h<20||h>=320)?'pink':'white';
if(h<15||h>=345)return l<.36?'burgundy':l>.7?'pink':'red';
if(h<45)return l<.42?'brown':'tan';if(h<70)return l<.4?'olive':'gold';if(h<100)return'olive';if(h<170)return'green';
if(h<250)return l<.32?'navy':l>.68?'lightblue':'blue';return l>.7?'pink':'purple'}
function analyze(o){const d=o.getContext('2d').getImageData(0,0,64,64).data,L=new Float32Array(4096);let r=0,g=0,b=0,m=0;
for(let i=0;i<4096;i++){r+=d[i*4];g+=d[i*4+1];b+=d[i*4+2];L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];m+=L[i]}m/=4096;
let v=0;for(const x of L)v+=(x-m)**2;const sd=Math.sqrt(v/4096);let gx=0,gy=0;
for(let y=1;y<63;y++)for(let x=1;x<63;x++){gx+=Math.abs(L[y*64+x+1]-L[y*64+x-1]);gy+=Math.abs(L[y*64+x+64]-L[y*64+x-64])}
const ratio=Math.max(gx,gy)/(Math.min(gx,gy)+1);
return{color:nameColor(r/4096,g/4096,b/4096),pattern:sd<7?'solid':sd<13?'texture':ratio>2.2?'stripe':'check'}}
const TL={'a photo of a business suit':'suit','a photo of a blazer':'blazer','a photo of dress pants':'pants','a photo of a dress shirt':'shirt','a photo of a necktie':'tie','a photo of a tie clip':'tieclip','a photo of a wristwatch':'watch','a photo of dress shoes':'shoes','a photo of a leather belt':'belt','a photo of a pair of socks':'socks'},NOUN={shoes:'dress shoes',belt:'leather belt',socks:'socks'};let clip;
async function ask(c){try{if(!clip){const m=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');m.env.allowLocalModels=false;clip=await m.pipeline('zero-shot-image-classification','Xenova/clip-vit-base-patch32')}
const u=c.toDataURL('image/jpeg',.8),best=async L=>(await clip(u,L)).sort((a,b)=>b.score-a.score)[0].label,type=TL[await best(Object.keys(TL))],o={type};
if(type==='watch'||type==='tieclip'){o.metal=(await best(['gold colored metal','silver colored metal'])).startsWith('gold')?'gold':'silver';o.color=o.metal}
else if(NOUN[type]){const cs=Object.keys(COLORS).filter(x=>x!=='gold'&&x!=='silver');o.color=(await best(cs.map(x=>`a photo of ${x} ${NOUN[type]}`))).split(' ')[3]}
return o}catch(e){return null}}
function fill(q,ai){const sw=swatchOf(q.big,q.cx,q.cy),a=analyze(sw);q.swatch=sw.toDataURL('image/png');q.ai=!!(ai&&TYPES[ai.type]);
q.type=q.ai?ai.type:'suit';q.color=ai&&COLORS[ai.color]?ai.color:a.color;q.pattern=ai&&PATS.includes(ai.pattern)?ai.pattern:a.pattern;q.metal=ai&&METAL[ai.metal]?ai.metal:'silver'}
async function addFiles(files){for(const f of files){const q={id:crypto.randomUUID(),busy:1,cx:.5,cy:.5};queue.push(q);renderAdd();
try{const img=await loadImg(f);q.big=shrink(img,640);q.photo=shrink(img,360).toDataURL('image/jpeg',.7);fill(q,await ask(q.big))}catch(e){q.err=1}q.busy=0;renderAdd()}}
function tap(e,i){const r=e.target.getBoundingClientRect(),q=queue[i];q.cx=(e.clientX-r.left)/r.width;q.cy=(e.clientY-r.top)/r.height;const sw=swatchOf(q.big,q.cx,q.cy);q.swatch=sw.toDataURL('image/png');if(!q.ai){const a=analyze(sw);q.color=a.color;q.pattern=a.pattern}renderAdd()}
const setq=(i,k,v)=>{queue[i][k]=v;if(k==='type')renderAdd()};
async function save(i){const q=queue[i],f=FABRIC.includes(q.type),it={id:q.id,type:q.type,color:q.color,pattern:f?q.pattern:'solid',photo:q.photo,added:Date.now()};
if(f)it.swatch=q.swatch;if(q.type==='watch'||q.type==='tieclip')it.metal=q.metal;await put(it);items.push(it);cache={};queue.splice(i,1);renderAdd()}
async function rm(id){if(!confirm('Delete this item?'))return;await del(id);items=items.filter(i=>i.id!==id);cache={};renderWardrobe()}

/* matching logic */
const LUM=i=>{const h=COLORS[i.color];return parseInt(h.slice(1,3),16)*.3+parseInt(h.slice(3,5),16)*.59+parseInt(h.slice(5,7),16)*.11};
const pw=i=>i?({solid:0,texture:.5}[i.pattern]??1):0;
const clash=(a,b)=>a&&b&&pw(a)>=1&&pw(b)>=1?(a.pattern===b.pattern?-40:-25):0;
const HARM={navy:['burgundy','red','gold','grey','lightblue','green','purple','pink'],charcoal:['burgundy','red','purple','navy','lightblue','pink'],grey:['navy','burgundy','blue','purple','pink'],black:['red','grey','burgundy','purple'],brown:['green','gold','navy','tan','burgundy','cream'],tan:['navy','brown','burgundy','green'],olive:['brown','burgundy','navy','gold','cream'],blue:['navy','burgundy','grey','gold']};
const SH={black:['black','charcoal','grey','navy'],charcoal:['black','burgundy','brown'],grey:['black','brown','burgundy'],navy:['brown','burgundy','black','tan'],brown:['brown','tan','burgundy'],tan:['brown','tan','burgundy'],olive:['brown','tan','burgundy'],blue:['brown','black']};
const shirtScore=(t,s)=>{if(!t)return 0;let v=({white:4,lightblue:3,cream:1,pink:1})[s.color]??-6;if(s.color===t.color)v-=25;if(t.color==='black'&&s.color!=='white')v-=8;return v+clash(t,s)};
function tieScore(t,sh,x){let v=0;if(t){if(x.color===t.color)v-=15;if((HARM[t.color]||[]).includes(x.color))v+=3;v+=clash(t,x)/2}
if(sh){if(x.color===sh.color)v-=15;if(Math.abs(LUM(x)-LUM(sh))>60)v+=3;v+=clash(sh,x)/2}if(pw(t)+pw(sh)>=2&&pw(x)>=1)v-=30;return v}
const pairScore=(t,p)=>{if(!t)return 0;let v=0;if(p.color===t.color)v-=30;if((t.color==='black')!==(p.color==='black'))v-=20;if(!['grey','charcoal','tan','navy','olive','brown','black'].includes(p.color))v-=20;return v+clash(t,p)};
const shoeScore=(b,s)=>{if(!b)return 0;const k=(SH[b.color]||['black','brown']).indexOf(s.color);return k<0?-50:6-k*2};
const beltScore=(sh,b)=>!sh?0:b.color===sh.color?10:['brown','burgundy','tan'].includes(b.color)&&['brown','burgundy','tan'].includes(sh.color)?3:-10;
const sockScore=(bot,sh,s)=>{let v=0;if(bot&&s.color===bot.color)v+=8;else if(sh&&s.color===sh.color)v+=4;if(s.pattern==='solid')v+=2;if(bot&&['white','cream','pink','lightblue'].includes(s.color))v-=10;return v};

function outfit(suitDay,n,by,last){const rest=i=>Math.min(n-(last[i.id]??-1e5),60);
const best=(arr,sc)=>{let b=null,bs=-1e9;for(const i of arr){const s=sc(i)+Math.min(rest(i),10);if(s>bs){bs=s;b=i}}if(!b)return null;const c={...b,rest:rest(b)};last[b.id]=n;return c};
const top=best(by(suitDay?'suit':'blazer'),i=>rest(i)*3),bot=suitDay?top:best(by('pants'),p=>pairScore(top,p));
const shirt=best(by('shirt'),s=>shirtScore(top,s)),tie=best(by('tie'),t=>tieScore(top,shirt,t)),shoes=best(by('shoes'),s=>shoeScore(bot,s));
const belt=best(by('belt'),b=>beltScore(shoes,b)),socks=best(by('socks'),s=>sockScore(bot,shoes,s)),watch=best(by('watch'),()=>0);
const clip=best(by('tieclip'),c=>watch&&c.metal===watch.metal?6:0);return{suitDay,top,bot,shirt,tie,shoes,belt,socks,watch,clip}}
function buildPlan(y,m){const by=t=>items.filter(i=>i.type===t).sort((a,b)=>a.id<b.id?-1:1),last={},plan={};
for(const d=new Date(y,m,-13);d<=new Date(y,m+1,0);d.setDate(d.getDate()+1)){const w=d.getDay();if(w<5)plan[key(d)]=outfit(w<4,di(d),by,last)}return plan}
const planFor=()=>cache[view.y+'-'+view.m]||(cache[view.y+'-'+view.m]=buildPlan(view.y,view.m));

/* mannequin */
function mannequin(o){const ids=new Set(),defs=[];
const F=(i,z)=>{if(!i)return'#cfcac0';if(!i.swatch)return COLORS[i.color];if(!ids.has(i.id)){ids.add(i.id);defs.push(`<pattern id="p${i.id}" width="${z}" height="${z}" patternUnits="userSpaceOnUse"><image href="${i.swatch}" width="${z}" height="${z}"/></pattern>`)}return`url(#p${i.id})`};
const J=F(o.top,44),P=F(o.bot,44),S=F(o.shirt,40),T=F(o.tie,26),sk=o.socks?COLORS[o.socks.color]:'#cfcac0',sh=o.shoes?COLORS[o.shoes.color]:'#cfcac0',wm=o.watch?METAL[o.watch.metal]||METAL.other:0,cm=o.clip?METAL[o.clip.metal]||METAL.other:0,sk2='#d8d3c9';
return`<svg viewBox="0 0 220 522" role="img" aria-label="Outfit on a mannequin"><defs>${defs.join('')}</defs>
<ellipse cx="110" cy="516" rx="72" ry="4" fill="#0003"/>
<ellipse cx="110" cy="38" rx="21" ry="26" fill="${sk2}"/><rect x="101" y="60" width="18" height="22" fill="#cfc9be"/>
<ellipse cx="41" cy="290" rx="9" ry="14" fill="${sk2}"/><ellipse cx="179" cy="290" rx="9" ry="14" fill="${sk2}"/>
<path d="M64 296H110L106 470H72ZM110 296H156L148 470H114Z" fill="${P}" stroke="#0005"/>
<rect x="78" y="468" width="22" height="22" fill="${sk}"/><rect x="120" y="468" width="22" height="22" fill="${sk}"/>
<path d="M76 488H102V503Q102 511 92 511H56Q54 499 68 496ZM144 488H118V503Q118 511 128 511H164Q166 499 152 496Z" fill="${sh}" stroke="#0006"/>
<path d="M92 78H128L150 100V270H70V100Z" fill="${S}" stroke="#0004"/>
<path d="M98 78L110 98L88 96ZM122 78L110 98L132 96Z" fill="${S}" stroke="#0005"/>
${o.tie?`<path d="M104 92h12l-2 11h-8zM106 103h8l7 88-11 15-11-15z" fill="${T}" stroke="#0005"/>`:''}
<path d="M58 102L38 110L30 268H52L66 130ZM162 102L182 110L190 268H168L154 130Z" fill="${J}" stroke="#0005"/>
<rect x="30" y="266" width="22" height="7" fill="${S}" stroke="#0004"/><rect x="168" y="266" width="22" height="7" fill="${S}" stroke="#0004"/>
${wm?`<rect x="168" y="277" width="22" height="8" rx="2" fill="${wm}" stroke="#0006"/><circle cx="179" cy="281" r="6.5" fill="${wm}" stroke="#0007"/><circle cx="179" cy="281" r="3.5" fill="#101820"/>`:''}
<path d="M64 98L98 84L110 170V300H62L56 112ZM156 98L122 84L110 170V300H158L164 112Z" fill="${J}" stroke="#0006"/>
<path d="M98 84L110 170L90 132L84 100ZM122 84L110 170L130 132L136 100Z" fill="${J}" stroke="#0006"/>
<path d="M70 200h20M130 200h20" stroke="#0005"/><circle cx="107" cy="205" r="2" fill="#0007"/>
${cm?`<rect x="104" y="132" width="12" height="3" rx="1" fill="${cm}" stroke="#0006" stroke-width=".5"/>`:''}</svg>`}

/* views */
const desc=i=>i.color+(i.pattern!=='solid'?' '+i.pattern:'')+(i.metal?' · '+i.metal:'');
const nm=i=>i?i.color+(i.pattern!=='solid'?' '+i.pattern:'')+' '+TYPES[i.type].toLowerCase():'none';
const bg=i=>i.swatch?`url(${i.swatch})`:COLORS[i.color]||METAL[i.metal];
const slots=o=>[[o.suitDay?'Suit':'Blazer',o.top],...(o.suitDay?[]:[['Pants',o.bot]]),['Shirt',o.shirt],['Tie',o.tie],['Tie clip',o.clip],['Watch',o.watch],['Belt',o.belt],['Socks',o.socks],['Shoes',o.shoes]]
.map(([l,i])=>`<div class="row"><span class="mut">${l}</span>${i?`<span class="dot" style='background:${bg(i)}'></span><span class="cap">${desc(i)}</span>`:'<span class="mut">Add one on the Add tab</span>'}</div>`).join('');
function planHtml(p){const f=new Date(view.y,view.m,1),days=[];for(const d=new Date(f);d.getMonth()===view.m;d.setDate(d.getDate()+1))if(d.getDay()<5)days.push(new Date(d));
return`<div class="nav"><button onclick="mv(-1)" aria-label="Previous month">‹</button><h2>${f.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="mv(1)" aria-label="Next month">›</button></div>`+days.map(d=>{const o=p[key(d)];
return`<div class="pl ${key(d)===key(sel)?'on':''}" onclick="pick(${d.getTime()})"><b>${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</b><span class="cap">${o.suitDay?nm(o.top):nm(o.top)+' + '+nm(o.bot)}, ${o.shirt?o.shirt.color+' shirt':'no shirt'}, ${o.tie?desc(o.tie)+' tie':'no tie'}</span></div>`}).join('')}
function renderToday(){const p=planFor(),o=p[key(sel)];let h=`<h2>${sel.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2>`;
if(sel.getDay()>4)h+='<p class="mut">Nothing is scheduled on Fridays and Saturdays.</p>';
else if(!items.length)h+='<p class="mut">Your wardrobe is empty. Add photos on the Add tab to get an outfit.</p>';
else if(o)h+=`<div class="man">${mannequin(o)}</div>${o.top&&o.top.rest<COOL?`<p class="warn">This ${o.suitDay?'suit':'blazer'} was worn ${o.top.rest} day${o.top.rest===1?'':'s'} ago. Add more ${o.suitDay?'suits':'blazers'} to get a ${COOL}-day rest.</p>`:''}<div class="list">${slots(o)}</div>`;
$('#today').innerHTML=h+planHtml(p)}
function mv(n){view.m+=n;if(view.m>11){view.m=0;view.y++}if(view.m<0){view.m=11;view.y--}const d=new Date(view.y,view.m,1);while(d.getDay()>4)d.setDate(d.getDate()+1);sel=d;renderToday()}
function pick(t){sel=new Date(t);renderToday();scrollTo(0,0)}
function renderWardrobe(){const cnt=t=>t==='all'?items.length:items.filter(i=>i.type===t).length;
const chips=['all',...Object.keys(TYPES)].map(t=>`<button class="chip ${flt===t?'on':''}" onclick="flt='${t}';renderWardrobe()">${t==='all'?'All':TYPES[t]} ${cnt(t)}</button>`).join('');
const list=items.filter(i=>flt==='all'||i.type===flt).sort((a,b)=>a.type.localeCompare(b.type)||b.added-a.added);
$('#wardrobe').innerHTML=`<h2>Wardrobe</h2><div class="chips">${chips}</div>`+(list.length?`<div class="grid">${list.map(i=>`<div class="gi"><img class="ph" src="${i.photo}" alt=""><b>${TYPES[i.type]}</b><br><small class="cap">${desc(i)}</small><div class="btns"><button onclick="rm('${i.id}')">Delete</button></div></div>`).join('')}</div>`:'<p class="mut">Nothing here yet. Add photos on the Add tab.</p>')}
const S=(list,v,k,i)=>`<select onchange="setq(${i},'${k}',this.value)">${list.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select>`;
function renderAdd(){$('#note').textContent='Photos are read on this phone and never uploaded. Check every field before confirming.';
$('#queue').innerHTML=queue.map((q,i)=>q.busy?'<div class="card">Reading photo… the first one downloads the model, so give it a minute.</div>':q.err?`<div class="card">That image couldn’t be read. <button onclick="queue.splice(${i},1);renderAdd()">Dismiss</button></div>`:
`<div class="card"><div class="rv"><img class="ph" src="${q.photo}" alt="" onclick="tap(event,${i})">${FABRIC.includes(q.type)?`<div><img class="sw" src="${q.swatch}" alt="Swatch"><small>Tap the photo to move the swatch.</small></div>`:''}</div>
<label>Item ${S(Object.entries(TYPES),q.type,'type',i)}</label><label>Colour ${S(Object.keys(COLORS).map(c=>[c,c]),q.color,'color',i)}</label>
${FABRIC.includes(q.type)?`<label>Pattern ${S(PATS.map(c=>[c,c]),q.pattern,'pattern',i)}</label>`:''}${q.type==='watch'||q.type==='tieclip'?`<label>Metal ${S(Object.keys(METAL).map(c=>[c,c]),q.metal,'metal',i)}</label>`:''}
<div class="btns"><button class="pri" onclick="save(${i})">Confirm</button><button onclick="queue.splice(${i},1);renderAdd()">Skip</button></div><small>${q.ai?'Read on this phone.':'Pixel analysis only. Check the item type.'}</small></div>`).join('')}
function show(t){for(const s of['today','wardrobe','add']){$('#'+s).hidden=s!==t;$('#n-'+s).classList.toggle('on',s===t)}const f={today:renderToday,wardrobe:renderWardrobe,add:renderAdd};f[t]()}
db.then(()=>tx('readonly',s=>s.getAll())).then(r=>{items=r||[];show('today')});
</script></body></html>
